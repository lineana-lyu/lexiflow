name: Finalize desktop app migration

on:
  push:
    branches:
      - feat/desktop-app-persistence
    paths:
      - scripts/finalize-desktop.py
      - .github/workflows/finalize-desktop.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/desktop-app-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply final desktop fixes
        run: python scripts/finalize-desktop.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static validation
        run: npm run check

      - name: Build Windows application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Ensure no tracked test artifacts were added
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)(tests?|fixtures?|mocks?)(/|$)|\.(test|spec)\.' }
          if ($bad) { $bad; exit 1 }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-Windows-final
          path: dist/*.exe
          if-no-files-found: error

      - name: Remove temporary finalizer
        shell: pwsh
        run: |
          Remove-Item scripts/finalize-desktop.py -Force
          Remove-Item .github/workflows/finalize-desktop.yml -Force
          if (Test-Path scripts) { if (-not (Get-ChildItem scripts -Force)) { Remove-Item scripts -Force } }

      - name: Commit final desktop changes
        shell: pwsh
        run: |
          git config user.name "LexiFlow Desktop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden desktop persistence and simplify UI"
          git push origin HEAD:feat/desktop-app-persistence
