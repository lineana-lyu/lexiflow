name: Validate Kokoro Process Isolation

on:
  push:
    branches:
      - fix/kokoro-process-isolation

permissions:
  contents: write

jobs:
  windows-kokoro:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/kokoro-process-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply UI patch
        run: python scripts/apply-kokoro-process-fix.py
      - name: Syntax check
        run: npm run check
      - name: Verify Settings navigation does not auto-refresh
        shell: pwsh
        run: |
          $text = Get-Content public/app.js -Raw
          if ($text.Contains('state.route==="settings"||state.route==="add"')) { throw 'Settings still auto-refreshes provider status' }
          if ($text.Contains('SpeechSynthesisUtterance')) { throw 'Windows SpeechSynthesis fallback still present' }
      - name: Verify parent responsiveness during first Kokoro synthesis
        shell: pwsh
        env:
          LEXIFLOW_DATA_DIR: ${{ runner.temp }}\lexiflow-data
        run: |
          @'
          const t=require('./lib/kokoro-tts');
          let last=Date.now(), maxGap=0, ticks=0;
          const timer=setInterval(()=>{const now=Date.now();maxGap=Math.max(maxGap,now-last);last=now;ticks++;},100);
          (async()=>{
            const synth=t.synthesize('LexiFlow keeps the interface responsive while natural speech is prepared.',{voice:'af_bella'});
            await new Promise(r=>setTimeout(r,800));
            const live=t.status();
            if(!live.workerIsolated) throw new Error('Kokoro is not worker isolated');
            if(Number(live.cpuThreadLimit)!==1) throw new Error(`unexpected CPU thread limit: ${live.cpuThreadLimit}`);
            const result=await synth;
            clearInterval(timer);
            console.log(JSON.stringify({ticks,maxGap,cacheHit:result.cacheHit,voice:result.voice,workerIsolated:t.status().workerIsolated,cpuThreadLimit:t.status().cpuThreadLimit}));
            if(ticks<5) throw new Error(`parent event loop barely progressed: ${ticks} ticks`);
            if(maxGap>1800) throw new Error(`parent event loop stalled for ${maxGap}ms`);
            if(!result.dataUrl.startsWith('data:audio/wav;base64,')) throw new Error('missing WAV output');
            await t.stop();
          })().catch(async err=>{clearInterval(timer);console.error(err);try{await t.stop()}catch{};process.exit(1)});
          '@ | Set-Content -Encoding UTF8 .tmp-kokoro-responsive.js
          node .tmp-kokoro-responsive.js
          Remove-Item .tmp-kokoro-responsive.js
      - name: Diff check
        run: git diff --check
      - name: Commit generated app patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          if (git diff --cached --quiet) {
            Write-Host "No generated UI changes"
          } else {
            git commit -m "fix: keep settings responsive and use natural word fallback"
            git push origin HEAD:fix/kokoro-process-isolation
          }
