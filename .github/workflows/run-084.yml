name: Run LexiFlow v0.8.4 refinement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/apply_084.py
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build Windows app
        run: npm run build:win
      - name: Check no test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)(tests?|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.' }
          if ($bad) { $bad; exit 1 }
      - name: Commit refinement
        shell: pwsh
        run: |
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-084.yml
          git rm .github/workflows/ui-image-quality-084.yml
          git rm .github/scripts/apply_084.py
          git add server.js public/app.js public/styles.css package.json package-lock.json
          git commit -m "refine: improve image quality and simplify visual design"
          git push origin HEAD:main
