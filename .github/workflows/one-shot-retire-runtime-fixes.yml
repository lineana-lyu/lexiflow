name: One-shot Retire Runtime Fixes

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-retire-runtime-fixes.yml
      - scripts/retire-runtime-fixes-transport.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Consolidate runtime compatibility into transport
        run: python scripts/retire-runtime-fixes-transport.py
      - name: Verify migration
        shell: bash
        run: |
          node --check public/transport-fixes.js
          node --check scripts/check-runtime-cleanup-v3.js
          node --check scripts/check-ai-assist-v3.js
          node --check scripts/check-stage-renderers-v3.js
          test ! -e public/runtime-fixes.js
          ! grep -q 'runtime-fixes.js' public/index.html
          ! grep -q 'node --check public/runtime-fixes.js' package.json
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/transport-fixes.js public/index.html package.json scripts/check-runtime-cleanup-v3.js scripts/check-ai-assist-v3.js scripts/check-stage-renderers-v3.js
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 0; }
          git commit -m "refactor: retire runtime compatibility wrapper [transport-consolidation]"
          git push origin HEAD:feat/v7-airy-luminous-ui
