name: Apply UX polish and fast review update

on:
  push:
    branches:
      - feat/ux-polish-fast-review

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ux-polish-fast-review
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply product update
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply_ux_polish.py

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check

      - name: Build Windows application
        run: npm run build:win

      - name: Ensure no tracked test artifacts were added
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(test|tests|__tests__)(/|$)|\.(test|spec)\.|(^|/)(fixtures?|mocks?)(/|$)'
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Test/spec/fixture/mock artifacts are not allowed in this project.'
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-Windows-v0.6.0
          path: dist/*.exe
          if-no-files-found: error

      - name: Remove temporary patch files
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-ux-polish-fast-review.yml'
          Remove-Item 'scripts/apply_ux_polish.py'
          if (Test-Path 'scripts' -PathType Container) {
            if (-not (Get-ChildItem 'scripts' -Force)) { Remove-Item 'scripts' }
          }

      - name: Commit feature update
        shell: pwsh
        run: |
          git config user.name 'LexiFlow Feature Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'No changes produced by feature workflow.' }
          git commit -m 'feat: tighten review flow and desktop experience'
          git push origin HEAD:feat/ux-polish-fast-review
