name: One-shot Stage Action Writer Resync

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-stage-action-writer-resync.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Resync stage action writers from Gateway after POST
        run: python scripts/resync-stage-action-writers.py
      - name: Verify migration
        run: |
          node --check public/memorize-stage-v3.js
          node --check public/visualize-actions-v3.js
          node --check public/apply-actions-v3.js
          node --check scripts/check-stage-commands-v3.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/memorize-stage-v3.js public/visualize-actions-v3.js public/apply-actions-v3.js scripts/check-stage-commands-v3.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: resync stage action writers from Gateway [stage-writer-resync]"
          git push origin HEAD:feat/v7-airy-luminous-ui
