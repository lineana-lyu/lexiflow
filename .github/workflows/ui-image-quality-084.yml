name: LexiFlow v0.8.4 visual quality refinement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply visual and UI refinements
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          server = Path('server.js')
          app = Path('public/app.js')
          css = Path('public/styles.css')
          pkg = Path('package.json')
          lock = Path('package-lock.json')

          s = server.read_text(encoding='utf-8')
          a = app.read_text(encoding='utf-8')
          c = css.read_text(encoding='utf-8')

          old_scene = '''  const prompt=`为英语学习者设计一个视觉记忆场景和一个个人化造句问题。\\n单词：${word}\\n词义：${meaningZh}\\n例句：${exampleEn}\\n准确语义：${senseIntentEn}\\n${previousScene?`不要重复这个旧场景：${previousScene}`:""}\\n要求：场景必须具体、生活化、可直接画成图片，严格对应当前词义；问题要让用户自然说出与自己有关的话，不给答案。\\n只输出 JSON：{"scene":"一句中文具体画面","cue":"6~16字记忆钩子","practiceQuestion":"一句简短中文问题"}`;'''
          new_scene = '''  const prompt=`为英语学习者设计一个视觉记忆场景和一个个人化造句问题。\\n单词：${word}\\n词义：${meaningZh}\\n例句：${exampleEn}\\n准确语义：${senseIntentEn}\\n${previousScene?`不要重复这个旧场景：${previousScene}`:""}\\n要求：\\n1. 场景必须具体、生活化、可直接画成图片，严格对应当前词义。\\n2. 场景只能依靠人物、动作、环境和物体表达含义，绝不能依靠画面中的文字来提示答案。\\n3. scene 中不要出现“写着/标着/印着/标签/招牌/logo/屏幕文字”等设计，也不要出现目标英文单词、中文释义、字母、数字或引号中的文案。\\n4. 如果涉及瓶子、包装、书本、屏幕、菜单、路牌等容易带字的物体，明确写成“无标签、无品牌、无可读文字”的版本。\\n5. 优先一个清晰动作和一个视觉焦点，避免堆砌物件。\\n6. 问题要让用户自然说出与自己有关的话，不给答案。\\n只输出 JSON：{"scene":"一句中文具体画面，不含任何画面文字要求","cue":"6~16字记忆钩子","practiceQuestion":"一句简短中文问题"}`;'''
          s = replace_once(s, old_scene, new_scene, 'visual scene prompt')

          old_rules = '''硬规则：
1. 用户场景优先级最高。人物、地点、动作、物体和关系都必须保留。
1.1 如果没有精确英文语义元数据，则把“当前中文词义”视为最重要的消歧信息，并优先现代日常最常见含义。例如“键盘”默认是电脑输入设备，除非词义、例句或用户描述明确指向钢琴/乐器键盘。
2. 当前词义只用于防止画错义项。
3. 不要把具体名词默认做成孤立商品图；除非用户明确要求。
4. 不要文字、字幕、单词、中文释义、logo、水印。
5. 如果场景说“女生在图书馆看书”，必须同时有女生、图书馆和看书动作，不能只画一本书。
6. 画面自然、明确、适合记忆。'''
          new_rules = '''硬规则：
1. 人物、地点、动作、物体和关系要忠实保留，但“场景中的文字要求”不是要真的画出来。若描述里出现“写着/标着/印着/标签为 XX”，只把 XX 当作语义提示，最终必须改成无文字的视觉表现。
1.1 如果没有精确英文语义元数据，则把“当前中文词义”视为最重要的消歧信息，并优先现代日常最常见含义。例如“键盘”默认是电脑输入设备，除非词义、例句或用户描述明确指向钢琴/乐器键盘。
2. 当前词义只用于防止画错义项，绝不能把目标词本身写到图里。
3. 不要把具体名词默认做成孤立商品图；优先自然生活场景和清晰动作。
4. 画面中零文字：禁止目标单词“${word}”、中文释义、任何可读或伪造的字母/数字、包装标签、品牌、logo、水印、价格签、菜单、招牌、路牌、屏幕 UI、书页文字。包装和瓶身必须是干净的无标签版本。
5. 人物手指、四肢和物体结构必须自然正确；不要重复手指、畸形手掌、融合物体、错误瓶盖或漂浮物件。
6. 风格采用自然的生活方式编辑摄影：真实肤质、正常比例、自然光线、不过度磨皮、不夸张景深、不高饱和、不做“AI 概念海报”效果。
7. 构图只保留一个主要动作和一个视觉焦点，背景简洁，不用文字来解释画面。
8. 保存最终 PNG 前自检：如果出现任何文字/标签/品牌、明显手部或物体结构错误，先修正或重新生成，再保存最终图。'''
          s = replace_once(s, old_rules, new_rules, 'image hard rules')

          old_image_lead = '''  const prompt = `$imagegen
请立即生成图片，不要先解释或讨论。

为英语学习软件 LexiFlow 生成一张视觉联想记忆图。'''
          new_image_lead = '''  const prompt = `$imagegen
请直接生成最终图片，不要先解释、不要展示设计稿、不要输出文字说明。

为英语学习软件 LexiFlow 生成一张用于“看图回忆词义”的视觉联想图。图片本身不能泄露答案，也不能出现任何文字。'''
          s = replace_once(s, old_image_lead, new_image_lead, 'image prompt lead')

          # Refresh old risky scene suggestions automatically instead of reusing scenes that explicitly ask for visible text.
          anchor = '''async function ensureVisualSceneSuggestion(card,refresh=false){'''
          insert = '''function visualSceneNeedsRefresh(scene,word){
  const value=String(scene||"").trim();
  if(!value)return false;
  const target=String(word||"").trim();
  if(target&&value.toLowerCase().includes(target.toLowerCase()))return true;
  if(/[A-Za-z0-9]{2,}/.test(value))return true;
  return /(写着|标着|印着|标签|招牌|logo|LOGO|屏幕文字|文字为|字样)/.test(value);
}

'''+anchor
          a = replace_once(a, anchor, insert, 'scene risk helper')

          old_trigger = '''  if((!scene||!card.practicePrompt?.question)&&!sceneLoading){setTimeout(()=>void ensureVisualSceneSuggestion(card,false),0);}'''
          new_trigger = '''  const riskyStoredScene=visualSceneNeedsRefresh(scene,card.word);
  if((!scene||!card.practicePrompt?.question||riskyStoredScene)&&!sceneLoading){setTimeout(()=>void ensureVisualSceneSuggestion(card,riskyStoredScene),0);}'''
          a = replace_once(a, old_trigger, new_trigger, 'scene auto refresh')

          old_empty = '''    : `<div class="visual-canvas-empty"><span>✦</span><strong>${generating?progress.title:"你的联想图会出现在这里"}</strong></div>`;'''
          new_empty = '''    : `<div class="visual-canvas-empty"><strong>${generating?progress.title:"联想图会显示在这里"}</strong><span>${generating?"生成完成后会自动更新":"先确认右侧场景，再生成图片"}</span></div>`;'''
          a = replace_once(a, old_empty, new_empty, 'visual empty state')

          old_stage = '''  return `${stageKicker("视觉联想")}
    <div class="visual-learning-stage">
      <div class="learning-stage-heading">
        <div><span class="learning-stage-index">04</span><h2>用一个画面记住 ${escapeHtml(card.word)}</h2></div>
        <div class="learning-stage-meta">${escapeHtml(card.meaningZh)} · ${escapeHtml(card.pos||"")}</div>
      </div>

      <div class="visual-workspace">
        <div class="visual-image-canvas ${hasImage?"has-image":""} ${generating?"is-generating":""}">
          ${imageArea}
          ${generating?`<div class="visual-generating-overlay"><span class="mini-spinner"></span><strong>${escapeHtml(progress.title)}</strong><small>${escapeHtml(progress.detail)}</small>${progressStrip}</div>`:""}
        </div>
        <aside class="ai-scene-panel ${sceneLoading?"is-loading":""}">
          <div class="ai-panel-label"><span class="ai-spark">✦</span><span>AI 联想场景</span><small>可直接修改</small></div>
          ${sceneLoading&&!sceneDraft?`<div class="ai-scene-loading"><span class="mini-spinner"></span><span>正在构思一个好记的画面…</span></div>`:`<textarea class="ai-scene-editor" id="visual-note" placeholder="直接修改这个场景，生成图片时会按这里的内容来。">${escapeHtml(sceneDraft)}</textarea>`}
          ${cue?`<div class="ai-scene-cue">记忆钩子 · ${escapeHtml(cue)}</div>`:""}
          <button class="text-action scene-refresh-action" data-action="refresh-visual-scene" ${sceneLoading||generating?"disabled":""}>${sceneLoading?`<span class="mini-spinner"></span>${sceneRefreshing?"正在换一个…":"正在准备…"}`:"换一个"}</button>
        </aside>
      </div>

      ${generation.status==="error"?`<div class="visual-status-inline error"><span>这次没有生成成功，可以重试或上传自己的图片。</span></div>`:""}

      <div class="visual-command-bar">
        <button class="btn primary visual-primary-action" data-action="generate-visual" ${generating||!sceneDraft?"disabled":""}>${generating?"生成中…":hasImage?"✦ 重新生成":"✦ AI 生成联想图"}</button>
        <label class="text-action upload-text-action" for="visual-file">上传自己的图片</label>
      </div>
      <input id="visual-file" type="file" accept="image/png,image/jpeg,image/webp" style="display:none" />

      <div class="learning-stage-footer single-action">
        <button class="btn primary" data-action="finish-visual">进入下一步 →</button>
      </div>
    </div>`;'''
          new_stage = '''  return `${stageKicker("视觉联想")}
    <div class="visual-learning-stage">
      <div class="learning-stage-heading">
        <div><span class="learning-stage-index">04 / 06</span><h2>用画面记住 ${escapeHtml(card.word)}</h2></div>
        <div class="learning-stage-meta">${escapeHtml(card.meaningZh)} · ${escapeHtml(card.pos||"")}</div>
      </div>

      <div class="visual-workspace">
        <div class="visual-image-canvas ${hasImage?"has-image":""} ${generating?"is-generating":""}">
          ${imageArea}
          ${generating?`<div class="visual-generating-overlay"><span class="mini-spinner"></span><strong>${escapeHtml(progress.title)}</strong><small>${escapeHtml(progress.detail)}</small>${progressStrip}</div>`:""}
        </div>
        <aside class="scene-panel ${sceneLoading?"is-loading":""}">
          <div class="scene-panel-label"><span>联想场景</span><small>可编辑</small></div>
          ${sceneLoading&&!sceneDraft?`<div class="scene-loading"><span class="mini-spinner"></span><span>正在准备场景…</span></div>`:`<textarea class="scene-editor" id="visual-note" placeholder="修改这个场景，生成图片时会按这里的内容来。">${escapeHtml(sceneDraft)}</textarea>`}
          ${cue?`<div class="scene-cue">记忆提示 · ${escapeHtml(cue)}</div>`:""}
          <button class="text-action scene-refresh-action" data-action="refresh-visual-scene" ${sceneLoading||generating?"disabled":""}>${sceneLoading?`<span class="mini-spinner"></span>${sceneRefreshing?"正在更换…":"正在准备…"}`:"换一个场景"}</button>
        </aside>
      </div>

      ${generation.status==="error"?`<div class="visual-status-inline error"><span>这次没有生成成功，可以重试或上传自己的图片。</span></div>`:""}

      <div class="visual-command-bar">
        <button class="btn primary visual-primary-action" data-action="generate-visual" ${generating||!sceneDraft?"disabled":""}>${generating?"生成中…":hasImage?"重新生成":"生成联想图"}</button>
        <label class="text-action upload-text-action" for="visual-file">上传图片</label>
      </div>
      <input id="visual-file" type="file" accept="image/png,image/jpeg,image/webp" style="display:none" />

      <div class="learning-stage-footer single-action">
        <button class="btn primary" data-action="finish-visual">下一步</button>
      </div>
    </div>`;'''
          a = replace_once(a, old_stage, new_stage, 'visual stage markup')

          # Remove the most conspicuous "AI assistant" wording in sentence practice actions.
          a = a.replace('✦ AI 帮我看看', '检查句子')

          editorial = r'''

/* v0.8.4 — quiet editorial UI: neutral, typographic, no "AI product" styling */
:root{
  --bg:#f5f5f2;
  --panel:#ffffff;
  --panel-soft:#fafaf8;
  --text:#202124;
  --muted:#70757c;
  --muted-2:#92979d;
  --line:#e3e3df;
  --line-soft:#eeeeeb;
  --blue:#2f5fc7;
  --blue-2:#244da8;
  --blue-soft:#eef2f8;
  --green:#3f7e64;
  --green-soft:#edf5f1;
  --amber:#9b6b22;
  --amber-soft:#faf4e9;
  --red:#b44c4c;
  --red-soft:#fbefef;
  --shadow:none;
  --radius:12px;
  --radius-sm:8px;
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;
  font-synthesis:none;
  text-rendering:optimizeLegibility;
}
html,body{background:var(--bg);color:var(--text);font-weight:400}
body{letter-spacing:0}
.sidebar{background:#f8f8f5;border-right:1px solid var(--line);padding:22px 16px}
.brand{gap:10px;padding:0 8px 20px}.brand strong{font-size:16px;font-weight:650;letter-spacing:-.01em}.brand span{font-size:10px;color:#8a8d91}
.logo{width:32px;height:32px;border-radius:7px;background:#fff;color:#242629;border:1px solid #d9d9d4;font-weight:700;box-shadow:none}
.nav{gap:3px}.nav-btn{border-radius:7px;padding:10px 11px;color:#5f6368;font-size:13px;font-weight:500}.nav-btn:hover{background:#efefeb}.nav-btn.active{background:#e9e9e4;color:#202124;font-weight:650}.nav-icon{color:#777b80;font-size:15px}
.sidebar-foot{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:14px 8px 0}.sidebar-foot strong{font-weight:600}.sidebar-foot p{color:#8a8d91}
.main{padding:28px 36px 52px}.content{max-width:1120px}
.page-head{margin-bottom:18px}.page-head h1{font-size:29px;font-weight:650;letter-spacing:-.025em;line-height:1.2}.page-head p{font-size:13px;color:#7b8087}.eyebrow{font-size:10px;font-weight:600;letter-spacing:.06em;color:#8a8f95}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:none}.card.pad{padding:20px}.card:hover{box-shadow:none}
.btn{min-height:40px;border-radius:8px;padding:0 15px;border-color:#d9d9d4;background:#fff;color:#3f4246;font-size:13px;font-weight:600;box-shadow:none}.btn:hover:not(:disabled){background:#f3f3f0;border-color:#c9c9c3}.btn.primary{background:#2f5fc7;border-color:#2f5fc7;color:#fff;box-shadow:none}.btn.primary:hover:not(:disabled){background:#244da8;border-color:#244da8}.btn.ghost{color:#666a70}
.pill{border-radius:6px;padding:4px 7px;font-size:10px;font-weight:600;background:#f0f0ed;color:#666a70}.pill.blue{background:#eef1f6;color:#4d617e}.pill.green{background:#edf4f0;color:#46745f}
.input,.textarea,.select{border-radius:8px;border-color:#d8d8d3;background:#fff;color:#202124}.input:focus,.textarea:focus,.select:focus{border-color:#8aa2d5;box-shadow:0 0 0 2px rgba(47,95,199,.10)}
.search-hero-card{background:#fff!important;padding:12px!important}.search-command-bar .search-input-wrap .input{border-radius:8px;background:#f7f7f4}.search-helper{color:#8b8f94}.search-helper span{border-color:#deded9}
.stat{padding:17px}.stat-label{font-size:11px}.stat-value{font-size:27px;font-weight:650;letter-spacing:-.02em}.section-title h2{font-size:16px;font-weight:650}.today-card h2{font-size:21px;font-weight:650}
.word-line h2,.learning-card-wordtop .word-line h2{font-weight:650;letter-spacing:-.025em}.primary-meaning{font-weight:650}.speaker,.sentence-speaker{border-radius:7px;background:#fff;box-shadow:none}
.study-progress-wrap{margin-bottom:14px}.study-stepper{padding:0 2px}.study-stepper-item{color:#8a8e94;font-size:11px;font-weight:500}.study-stepper-item.active{color:#2f5fc7;font-weight:650}.study-stepper-item.done{color:#4a7b67}.study-stepper-dot{width:24px;height:24px;border-radius:50%;background:#ecece8;color:#777b80;font-size:10px;font-weight:600;box-shadow:none}.study-stepper-item.active .study-stepper-dot{background:#2f5fc7;color:#fff}.study-stepper-item.done .study-stepper-dot{background:#e8f1ec;color:#4a7b67}.study-stepper-line{background:#dfdfda;height:1px}.study-stepper-line.done{background:#a9c8b8}
.study-card{padding:28px;border-radius:12px;min-height:440px}.study-kicker{font-size:10px;font-weight:600;letter-spacing:.06em;color:#8b8f94}.study-word,.target-word-text,.prompt-big{font-weight:650}.target-word-text{letter-spacing:-.025em}.prompt-big{letter-spacing:-.02em}.answer-box,.memory-answer-card{border-radius:9px;box-shadow:none}
.learning-stage-heading{padding-bottom:18px;border-bottom:1px solid var(--line-soft)}.learning-stage-heading>div:first-child{display:flex;align-items:baseline;gap:12px}.learning-stage-index{width:auto;height:auto;padding:0;border:0;border-radius:0;background:transparent;color:#8b8f94;font-size:10px;font-weight:600;letter-spacing:.08em}.learning-stage-heading h2{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}.learning-stage-meta{font-size:12px;color:#858a90}
.visual-workspace{grid-template-columns:minmax(0,1.55fr) minmax(280px,.72fr);gap:22px;margin-top:22px;align-items:stretch}.visual-image-canvas{border-radius:9px;border:1px solid #deded9;background:#f1f1ee;overflow:hidden;box-shadow:none;min-height:390px}.visual-memory-image{width:100%;height:100%;min-height:390px;object-fit:cover;border-radius:0;box-shadow:none}.visual-canvas-empty{min-height:390px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;color:#898d92}.visual-canvas-empty strong{font-size:14px;font-weight:600;color:#686c72}.visual-canvas-empty span{font-size:11px;color:#9a9da1}
.scene-panel{display:flex;flex-direction:column;min-width:0;padding:2px 0 2px 22px;border-left:1px solid var(--line);background:transparent}.scene-panel-label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0 13px}.scene-panel-label span{font-size:13px;font-weight:650;color:#3b3e43}.scene-panel-label small{font-size:10px;color:#94989d}.scene-editor{width:100%;min-height:190px;flex:1;padding:0 0 12px;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;resize:none;background:transparent;color:#303338;font:inherit;font-size:15px;font-weight:500;line-height:1.8;outline:none}.scene-editor:focus{border-bottom-color:#aebbd4}.scene-cue{margin-top:14px;color:#858a90;font-size:11px;line-height:1.6}.scene-loading{display:flex;align-items:center;gap:8px;color:#80858b;font-size:12px}.scene-refresh-action{align-self:flex-start;margin-top:14px;padding:0;color:#5f6670;font-size:12px;font-weight:600}.scene-refresh-action:hover{color:#2f5fc7}
.visual-command-bar{display:flex;justify-content:flex-start;align-items:center;gap:14px;margin-top:16px;padding-left:0}.visual-primary-action{min-width:118px}.upload-text-action{font-size:12px;color:#666b72;font-weight:600}.learning-stage-footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--line-soft)}.learning-stage-footer.single-action{justify-content:flex-end}.learning-stage-footer .btn.primary{min-width:88px}
.visual-generating-overlay{background:rgba(246,246,243,.92);backdrop-filter:none}.visual-progress-strip span{border-radius:5px}.visual-status-inline{border-radius:8px}
.ai-scene-panel,.ai-panel-label,.ai-spark,.ai-scene-editor,.ai-scene-cue,.ai-scene-loading{box-shadow:none!important}
.lookup-loader-orb,.auto-visual-icon{border-radius:8px;background:#f1f1ed;box-shadow:none}.lookup-loader-track i{background:#6d7f9f}.auto-resolved-note{border-radius:8px;background:#f7f7f4}.sense,.setting-row,.editor,.feedback,.table-wrap{border-radius:9px;box-shadow:none}.sense.selected{background:#f6f7f8;box-shadow:none}.progress-track{height:6px}.progress-bar,.bar{background:#5f789f}.toast{border-radius:8px!important;box-shadow:0 6px 18px rgba(0,0,0,.08)!important}
@media(max-width:920px){.visual-workspace{grid-template-columns:1fr}.scene-panel{padding:18px 0 0;border-left:0;border-top:1px solid var(--line)}.visual-memory-image,.visual-canvas-empty,.visual-image-canvas{min-height:320px}}
'''
          c += editorial

          server.write_text(s, encoding='utf-8')
          app.write_text(a, encoding='utf-8')
          css.write_text(c, encoding='utf-8')

          for path in (pkg, lock):
              data=json.loads(path.read_text(encoding='utf-8'))
              data['version']='0.8.4'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .apply_084.py
          python .apply_084.py
          Remove-Item .apply_084.py
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: npm run check
      - name: Validate visual/UI guards
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('server.js','utf8'); const a=fs.readFileSync('public/app.js','utf8'); if(!s.includes('画面中零文字')||!s.includes('人物手指、四肢和物体结构必须自然正确')) process.exit(1); if(!a.includes('visualSceneNeedsRefresh')||a.includes('✦ AI 生成联想图')||a.includes('AI 联想场景')) process.exit(1);"
      - name: Build Windows application
        run: npm run build:win
      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)(tests?|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.' }
          if ($bad) { $bad; exit 1 }
      - name: Commit product changes and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ui-image-quality-084.yml
          git add server.js public/app.js public/styles.css package.json package-lock.json
          git commit -m "refine: improve image quality and remove AI-styled UI"
          git push origin HEAD:main
