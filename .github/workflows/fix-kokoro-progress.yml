name: Validate Kokoro Download Progress Fix

on:
  push:
    branches:
      - fix/kokoro-download-progress

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/kokoro-download-progress
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        shell: pwsh
        run: |
          npm run check
          node --check public/kokoro-progress-ui.js
      - name: Verify progress UI wiring
        shell: pwsh
        run: |
          $index = Get-Content public/index.html -Raw
          $ui = Get-Content public/kokoro-progress-ui.js -Raw
          if (-not $index.Contains('kokoro-progress-ui.js')) { throw 'progress UI is not loaded' }
          if (-not $ui.Contains('/api/tts/kokoro/status')) { throw 'status polling missing' }
          if (-not $ui.Contains('data-kokoro-progress-bar')) { throw 'progress bar missing' }
          if (-not $ui.Contains('stopImmediatePropagation')) { throw 'legacy blocking click handler is not bypassed' }
      - name: Diff check
        run: git diff --check
