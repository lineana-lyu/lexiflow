name: Legacy Review Cleanup

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-legacy-review-cleanup-v3.js
      - scripts/apply-legacy-review-cleanup-v3.py
      - .github/workflows/legacy-review-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Align patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-legacy-review-cleanup-v3.py')
          s=p.read_text(encoding='utf-8')
          old='A change that passes syntax checks but re-loads a retired study/review script, restores no-argument `startStudy()`, or restores `activeLearningCards()[0]` as a Study entry fallback is a regression.'
          current='A change that restores a removed study/review shim, restores no-argument `startStudy()`, or restores `activeLearningCards()[0]` as a Study entry fallback is a regression.'
          if old not in s:
              raise SystemExit('expected docs patch anchor missing')
          s=s.replace(old,current,1)
          bad="""    '''  function localFeedback(text,word){''',\n    \"remove legacy initial Review stage UI\","""
          good="""    '''''',\n    \"remove legacy initial Review stage UI\","""
          if bad not in s:
              raise SystemExit('initial Review replacement anchor missing')
          s=s.replace(bad,good,1)
          bad="""  function libraryPage(){''',\n    \"replace legacy Review implementation with plan-only center\","""
          good="""''',\n    \"replace legacy Review implementation with plan-only center\","""
          if bad not in s:
              raise SystemExit('Review center replacement anchor missing')
          s=s.replace(bad,good,1)
          bad="""    if(action===\"refresh-provider\"){''',\n    \"retire legacy Apply-to-Review and Review action fallbacks\","""
          good="""''',\n    \"retire legacy Apply-to-Review and Review action fallbacks\","""
          if bad not in s:
              raise SystemExit('Review action replacement anchor missing')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply cleanup
        run: python3 scripts/apply-legacy-review-cleanup-v3.py
      - name: Verify repository
        run: npm run check
      - name: Commit cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/review-session-v3.js scripts/check-runtime-authority-v3.js scripts/check-review-session-v3.js docs/RUNTIME_AUTHORITY_V3.md
          git rm scripts/apply-legacy-review-cleanup-v3.js scripts/apply-legacy-review-cleanup-v3.py .github/workflows/legacy-review-cleanup.yml
          git commit -m "refactor: remove legacy Review authority from app"
          git push origin HEAD:feat/v7-airy-luminous-ui
