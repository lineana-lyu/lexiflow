name: Temp V7 Selection Pronunciation Fix
on:
  push:
    branches:
      - tmp-v7-selection-pronunciation-fix
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message != 'fix: streamline new-word selection and unify pronunciation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v7-selection-pronunciation-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply migration
        run: python3 scripts/tmp-v7-selection-pronunciation-fix.py
      - name: Syntax checks
        run: |
          node --check public/today-plan-v3.js
          node --check public/select-stage-v3.js
          node --check scripts/check-today-plan-v3.js
          node --check scripts/check-stage-renderers-v3.js
      - name: Full repository checks
        run: npm run check
      - name: Commit verified business changes
        run: |
          git config user.name "lineana"
          git config user.email "17570875940@163.com"
          git add public/today-plan-v3.js public/select-stage-v3.js scripts/check-today-plan-v3.js scripts/check-stage-renderers-v3.js
          git commit -m "fix: streamline new-word selection and unify pronunciation"
          git push origin HEAD:tmp-v7-selection-pronunciation-fix
