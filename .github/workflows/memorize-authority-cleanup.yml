name: Memorize Authority Cleanup

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-memorize-authority-cleanup-v3.py
      - .github/workflows/memorize-authority-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply cleanup
        run: python3 scripts/apply-memorize-authority-cleanup-v3.py
      - name: Verify repository
        run: npm run check
      - name: Commit cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/memorize-v2.js scripts/check-runtime-authority-v3.js docs/RUNTIME_AUTHORITY_V3.md
          git rm -f scripts/apply-memorize-authority-cleanup-v3.py .github/workflows/memorize-authority-cleanup.yml
          git commit -m "refactor: make Memorize module authoritative"
          git push origin HEAD:feat/v7-airy-luminous-ui
