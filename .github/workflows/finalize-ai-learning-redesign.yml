name: Finalize AI learning redesign

on:
  push:
    branches:
      - feat/ai-learning-experience-redesign

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ai-learning-experience-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Prevent background image completion from interrupting sentence typing
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if(state.study?.cardId===cardId) toast("联想图生成成功");','if(state.study?.cardId===cardId&&c.stage==="visualize") toast("联想图生成成功");',1)
          s=s.replace('if(state.study?.cardId===cardId) toast("图片没有生成成功，处理建议已保留在页面");','if(state.study?.cardId===cardId&&c.stage==="visualize") toast("图片没有生成成功，处理建议已保留在页面");',1)
          old='''        if(state.study?.cardId===cardId){\n          state.study.imageGenerating=false;\n          render();\n        }'''
          new='''        if(state.study?.cardId===cardId){\n          state.study.imageGenerating=false;\n          if(c.stage==="visualize") render();\n        }'''
          if old not in s: raise SystemExit('image finally anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          '@ | python -
      - run: npm ci
      - run: npm run check
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "lineana"
          git config user.email "17570875940@163.com"
          git rm .github/workflows/finalize-ai-learning-redesign.yml
          git add public/app.js
          git diff --cached --check
          git commit -m "fix: keep background image generation non-blocking"
          git push origin HEAD:feat/ai-learning-experience-redesign
