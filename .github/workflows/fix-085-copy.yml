name: Normalize v0.8.5 feedback copy
on:
  push:
    branches: [refine/quiet-ui-visual-qa-085]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refine/quiet-ui-visual-qa-085
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fix copy
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='public/app.js';
          let s=fs.readFileSync(p,'utf8');
          const old='title:"已采用 修改建议"';
          if(!s.includes(old)) throw new Error('copy anchor missing');
          s=s.replace(old,'title:"已采用修改建议"');
          fs.writeFileSync(p,s);
          NODE
      - name: Check JavaScript
        run: npm run check
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-085-copy.yml
          git add public/app.js
          git commit -m "polish: normalize feedback copy"
          git push origin HEAD:refine/quiet-ui-visual-qa-085
