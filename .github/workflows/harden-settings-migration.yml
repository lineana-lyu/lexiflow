name: Harden local settings migration

on:
  push:
    branches:
      - feat/ux-polish-fast-review

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ux-polish-fast-review
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Remove legacy plaintext settings after successful migration
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const file = 'server.js';
          let s = fs.readFileSync(file, 'utf8');
          const oldLine = 'if (!fs.existsSync(to) && fs.existsSync(from)) await fsp.copyFile(from, to);';
          const replacement = `if (!fs.existsSync(to) && fs.existsSync(from)) {
                await fsp.copyFile(from, to);
                if (name === "settings.json") {
                  try {
                    await fsp.unlink(from);
                  } catch (err) {
                    console.warn("legacy settings cleanup skipped:", err.message);
                  }
                }
              }`;
          if (!s.includes(oldLine)) throw new Error('migration target not found');
          s = s.replace(oldLine, replacement);
          fs.writeFileSync(file, s, 'utf8');
          '@ | Set-Content patch-settings.cjs -Encoding UTF8
          node patch-settings.cjs
          Remove-Item patch-settings.cjs
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: npm run check
      - name: Build Windows application
        run: npm run build:win
      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(test|tests|__tests__)(/|$)|\.(test|spec)\.|(^|/)(fixtures?|mocks?)(/|$)'
          if ($bad) { throw 'Test/spec/fixture/mock artifacts are not allowed.' }
      - name: Remove temporary workflow and commit
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/harden-settings-migration.yml'
          git config user.name 'LexiFlow Feature Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'security: remove legacy plaintext settings after migration'
          git push origin HEAD:feat/ux-polish-fast-review
