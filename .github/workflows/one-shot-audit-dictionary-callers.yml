name: One-shot Audit Dictionary Callers

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-audit-dictionary-callers.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Print dictionary frontend callers
        shell: bash
        run: |
          echo '=== SMART SEARCH ==='
          grep -RIn '/api/search/smart' public --include='*.js' || true
          echo
          echo '=== DICTIONARY LOOKUP ==='
          grep -RIn '/api/dictionary/lookup' public --include='*.js' || true
          echo
          echo '=== EXAMPLE HYDRATION EVENTS / API ==='
          grep -RInE 'examples-hydrated|LexiFlowExampleHydration|hydrateResult\(' public --include='*.js' || true
