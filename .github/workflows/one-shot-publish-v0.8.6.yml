name: One-shot publish v0.8.6

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-publish-v0.8.6.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release target and checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          target="ac3014450eb7d2627f2f89a1f51cc3d3fb50170a"
          current_main="$(gh api "repos/$repo/branches/main" --jq .commit.sha)"
          test "$current_main" = "$target"
          test "$(gh run view 34943711809 --repo "$repo" --json conclusion --jq .conclusion)" = "success"
          if gh release view v0.8.6 --repo "$repo" >/dev/null 2>&1; then
            echo "v0.8.6 already exists; refusing to overwrite"
            exit 1
          fi

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download 34943711809 --repo "$GITHUB_REPOSITORY" --name LexiFlow-Windows --dir release-files
          find release-files -maxdepth 1 -type f -name '*.exe' -print
          test "$(find release-files -maxdepth 1 -type f -name '*.exe' | wc -l)" -ge 2

      - name: Create public v0.8.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## LexiFlow v0.8.6

          This release adds the first built-in update-notification experience for LexiFlow.

          ### What's new
          - LexiFlow now checks the latest stable GitHub Release shortly after the packaged desktop app starts.
          - When a newer version is available, the app shows the new version number and the GitHub Release Notes as the update explanation.
          - Users can choose **稍后提醒** or **打开下载页**.
          - Update-check failures, offline use, timeouts, draft releases, and prereleases do not interrupt normal learning.
          - Update links are restricted to the official `lineana-lyu/lexiflow` GitHub Releases page.

          Starting with v0.8.6, future releases such as v0.8.7 can therefore be discovered from inside the installed app. v0.8.5 itself cannot gain this behavior retroactively and must be upgraded manually once to v0.8.6.

          ### Code signing policy

          **Free code signing provided by SignPath.io, certificate by SignPath Foundation.**

          The binaries in this release are intentionally **unsigned** while the SignPath Foundation application is under review. No LexiFlow binary should be considered SignPath-signed until the project has been approved and the automated signing workflow is enabled.

          Windows may therefore still show an Unknown Publisher or Microsoft Defender SmartScreen warning for this release.

          ### Windows downloads
          Use the Setup executable for a normal Windows installation. The portable executable can be run without installation.
          EOF

          gh release create v0.8.6 release-files/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target ac3014450eb7d2627f2f89a1f51cc3d3fb50170a \
            --title "LexiFlow v0.8.6" \
            --notes-file release-notes.md
