name: One-shot Security Banner Decorator

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-security-banner-decorator.yml
      - scripts/cleanup-security-banner-decorator.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Move security banner markup to base surface
        run: python scripts/cleanup-security-banner-decorator.py
      - name: Verify cleanup
        run: |
          node --check public/app.js
          node --check public/product-ux.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/product-ux.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: move Settings security banner to base surface [security-banner-cut]"
          git push origin HEAD:feat/v7-airy-luminous-ui
