name: One-shot Dictionary Surface Copy

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-dictionary-surface-copy.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Align dictionary surface copy
        run: python scripts/align-dictionary-surface-copy.py
      - name: Verify alignment
        run: |
          node --check public/app.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit alignment
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: align dictionary surface with local-first runtime [dictionary-surface-copy]"
          git push origin HEAD:feat/v7-airy-luminous-ui
