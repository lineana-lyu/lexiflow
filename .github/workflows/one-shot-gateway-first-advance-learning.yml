name: One-shot Gateway-first Advance Learning

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-gateway-first-advance-learning.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Prefer Gateway snapshot for Advance Learning redraws
        run: python scripts/gateway-first-advance-learning.py
      - name: Verify migration
        run: |
          node --check public/advance-learning-v3.js
          node --check scripts/check-advance-learning-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/advance-learning-v3.js scripts/check-advance-learning-v3.js
          git commit -m "refactor: make Advance Learning redraws Gateway-first [advance-gateway-first]"
          git push origin HEAD:feat/v7-airy-luminous-ui
