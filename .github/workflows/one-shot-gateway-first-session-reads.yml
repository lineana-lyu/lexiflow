name: One-shot Gateway-first Session Reads

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-gateway-first-session-reads.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Prefer Gateway snapshots for Study and Review session reads
        run: python scripts/gateway-first-session-reads.py
      - name: Verify migration
        run: |
          node --check public/study-session-v3.js
          node --check public/review-session-v3.js
          node --check scripts/check-study-session-v3.js
          node --check scripts/check-review-session-v3.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/study-session-v3.js public/review-session-v3.js scripts/check-study-session-v3.js scripts/check-review-session-v3.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: prefer Gateway snapshots for session reads [gateway-first-sessions]"
          git push origin HEAD:feat/v7-airy-luminous-ui
