name: One-shot Product UX Dead Settings

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-product-ux-dead-settings.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Remove dead Product UX Settings decorators
        run: python scripts/cleanup-product-ux-dead-settings.py
      - name: Verify cleanup
        run: |
          node --check public/product-ux.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/product-ux.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: remove dead Product UX Settings decorators [product-ux-settings-cut]"
          git push origin HEAD:feat/v7-airy-luminous-ui
