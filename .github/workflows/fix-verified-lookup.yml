name: Fix verified Chinese lookup and phrase pronunciation

on:
  push:
    branches:
      - 'fix/verified-chinese-lookup-phrases'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/verified-chinese-lookup-phrases
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch_lookup_083.py
      - name: Bump version
        run: npm version 0.8.3 --no-git-tag-version
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: npm run check
      - name: Validate lookup invariants
        shell: pwsh
        run: |
          $server = Get-Content server.js -Raw
          $app = Get-Content public/app.js -Raw
          if ($server -notmatch 'semanticMismatch:true') { throw 'semantic mismatch guard missing' }
          if ($server -notmatch 'merriam-webster-components') { throw 'phrase pronunciation fallback missing' }
          if ($app -notmatch 'data-search-alternative') { throw 'lookup recovery choices missing' }
          if ($app -notmatch 'audioUrls') { throw 'phrase audio metadata missing' }
      - name: Build Windows application
        run: npm run build:win
      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(test|tests|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.'
          if ($bad) { $bad; throw 'tracked test/spec/fixture/mock artifacts found' }
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          Remove-Item scripts/patch_lookup_083.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/fix-verified-lookup.yml -ErrorAction SilentlyContinue
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js public/app.js public/styles.css package.json package-lock.json scripts/patch_lookup_083.py .github/workflows/fix-verified-lookup.yml
          git commit -m "fix: verify Chinese lookup and support phrase pronunciation"
          git push origin HEAD:fix/verified-chinese-lookup-phrases
