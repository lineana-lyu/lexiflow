name: LexiFlow v0.8.7 release evidence
on:
  push:
    branches:
      - audit/lexiflow-v087-benchmark-20261017

permissions:
  contents: read

jobs:
  evidence:
    name: Windows evidence collection
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run collection against immutable v0.8.7
        shell: pwsh
        run: |
          & .\tools\collect-lexiflow-evidence.ps1 -Version v0.8.7 -OutputRoot "$env:RUNNER_TEMP\lexiflow-evidence"
      - name: Upload logs and benchmark outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexiflow-v087-evidence
          path: ${{ runner.temp }}/lexiflow-evidence/**/evidence/**
          if-no-files-found: warn
          retention-days: 30
