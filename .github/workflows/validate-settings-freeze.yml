name: Validate Settings Freeze Fix

on:
  push:
    branches:
      - fix/settings-mutation-observer-freeze

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
