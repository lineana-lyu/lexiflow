name: Learning Engine Check

on:
  push:
    branches:
      - main
      - feat/v7-airy-luminous-ui
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Run repository checks
        run: npm run check

  app-shell-cut:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-app-shell-cut]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0

      - name: Detach app shell from legacy stage dispatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(pattern, replacement, label, flags=re.S):
              global text
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}; refusing edit')
              text = next_text

          replace_once(
              r'^  const STAGES = \[\n(?:    \[.*\],?\n)+  \];\n\n',
              '',
              'legacy STAGES block',
              re.M,
          )

          replace_once(
              r'^  function stageIndex\(stage\)\{ return STAGES\.findIndex\(\(\[key\]\)=>key===stage\); \}\n\n'
              r'  function renderStageRail\(card\)\{\n'
              r'.*?'
              r'^  \}\n\n',
              '  function renderStageRail(card){\n'
              '    return `<div class="study-stepper" data-study-stepper-v3-host="${escapeHtml(card.id)}"></div>`;\n'
              '  }\n\n',
              'legacy stage rail',
              re.M | re.S,
          )

          replace_once(
              r'^  function renderStage\(card\)\{\n'
              r'.*?'
              r'^  \}\n\n'
              r'(?=  function stageTop\()',
              '  function renderStage(card){\n'
              '    return `<div data-study-stage-host-v3="${escapeHtml(card.id)}"></div>`;\n'
              '  }\n\n',
              'legacy stage dispatch',
              re.M | re.S,
          )

          forbidden = [
              'const STAGES = [',
              'function stageIndex(',
              'return stageSelect(card)',
              'return stageVisual(card)',
              'return stageApply(card)',
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit(f'Legacy dispatch remains after patch: {leftovers}')

          required = [
              'data-study-stepper-v3-host',
              'data-study-stage-host-v3',
              'window.LexiFlowStudyRenderer=Object.freeze',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Required V3 shell contract missing after patch: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify refactor before commit
        run: |
          node --check public/app.js
          npm run check:learning

      - name: Commit exact shell cut
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo "No app.js change produced"
            exit 1
          fi
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js
          git commit -m "refactor: detach app shell from legacy stage dispatch [app-shell-cut]"
          git push origin HEAD:feat/v7-airy-luminous-ui
