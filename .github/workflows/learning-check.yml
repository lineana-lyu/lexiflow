name: Learning Engine Check

on:
  push:
    branches:
      - main
      - feat/v7-airy-luminous-ui
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Run repository checks
        run: npm run check
