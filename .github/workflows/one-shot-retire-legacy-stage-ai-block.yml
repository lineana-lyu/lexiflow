name: One-shot Retire Legacy Stage AI Block

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-retire-legacy-stage-ai-block.yml
      - scripts/retire-legacy-stage-ai-block.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Retire legacy Stage AI firewall and lock endpoint ownership
        run: python scripts/retire-legacy-stage-ai-block.py
      - name: Verify migration
        run: |
          node --check public/runtime-fixes.js
          node --check scripts/check-ai-assist-v3.js
          node --check scripts/check-runtime-cleanup-v3.js
          node --check scripts/check-stage-renderers-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/runtime-fixes.js scripts/check-ai-assist-v3.js scripts/check-runtime-cleanup-v3.js scripts/check-stage-renderers-v3.js
          git commit -m "refactor: retire legacy Stage AI firewall [ai-authority-lock]"
          git push origin HEAD:feat/v7-airy-luminous-ui
