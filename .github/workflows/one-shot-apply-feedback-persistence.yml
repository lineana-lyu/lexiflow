name: One-shot Apply feedback persistence

on:
  push:
    branches:
      - fix/apply-feedback-persistence
    paths:
      - .github/workflows/one-shot-apply-feedback-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/apply-feedback-persistence
          fetch-depth: 0

      - name: Separate user edits from DOM restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stage = Path('public/apply-stage-v3.js')
          text = stage.read_text(encoding='utf-8')
          assert 'function handleComposerInput(input){' in text, 'Apply composer handler signature changed unexpectedly'
          assert 's.text=String(input.value||"");s.feedback=null;s.approved=false;s.suggestionApproved=false;' in text, 'Apply feedback invalidation line changed unexpectedly'
          text = text.replace('function handleComposerInput(input){', 'function handleComposerInput(input,{invalidateFeedback=true}={}){', 1)
          text = text.replace('s.text=String(input.value||"");s.feedback=null;s.approved=false;s.suggestionApproved=false;', 's.text=String(input.value||"");\n    if(invalidateFeedback){s.feedback=null;s.approved=false;s.suggestionApproved=false;}', 1)
          old_export = 'window.LexiFlowApplyStageV3=Object.freeze({isBusy(){const card=currentCard();return Boolean(card&&session(card).promptLoading);},handleInput(input){handleComposerInput(input);}});'
          new_export = 'window.LexiFlowApplyStageV3=Object.freeze({isBusy(){const card=currentCard();return Boolean(card&&session(card).promptLoading);},handleInput(input,options){handleComposerInput(input,options);}});'
          assert old_export in text, 'Apply stage bridge export changed unexpectedly'
          text = text.replace(old_export, new_export, 1)
          stage.write_text(text, encoding='utf-8')

          guard = Path('public/apply-input-guard-v3.js')
          text = guard.read_text(encoding='utf-8')
          call = 'window.LexiFlowApplyStageV3?.handleInput?.(input);'
          assert text.count(call) == 2, 'Expected exactly two Apply guard bridge calls'
          text = text.replace(call, 'window.LexiFlowApplyStageV3?.handleInput?.(input,{invalidateFeedback:true});', 1)
          text = text.replace(call, 'window.LexiFlowApplyStageV3?.handleInput?.(input,{invalidateFeedback:false});', 1)
          guard.write_text(text, encoding='utf-8')

          check = Path('scripts/check-learning-interaction-ux-v3.js')
          text = check.read_text(encoding='utf-8')
          old_assert = 'assert(apply.includes(\'handleInput(input){handleComposerInput(input);}\')&&apply.includes(\'LexiFlowApplyInputGuardV3?.setDraft?.(card.id,s.text)\'),"Apply stage must share draft authority with the pre-app guard");'
          new_assert = 'assert(apply.includes(\'handleInput(input,options){handleComposerInput(input,options);}\')&&apply.includes(\'LexiFlowApplyInputGuardV3?.setDraft?.(card.id,s.text)\'),"Apply stage must share draft authority with the pre-app guard");\nassert(guard.includes(\'handleInput?.(input,{invalidateFeedback:true})\')&&guard.includes(\'handleInput?.(input,{invalidateFeedback:false})\'),"Apply guard must distinguish real edits from DOM restoration");\nassert(apply.includes(\'function handleComposerInput(input,{invalidateFeedback=true}={})\')&&apply.includes(\'if(invalidateFeedback){s.feedback=null;s.approved=false;s.suggestionApproved=false;}\'),"DOM restoration must not erase AI feedback state");'
          assert old_assert in text, 'Apply interaction regression assertion changed unexpectedly'
          text = text.replace(old_assert, new_assert, 1)
          check.write_text(text, encoding='utf-8')
          PY

      - name: Validate repository
        run: npm ci && npm run check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-apply-feedback-persistence.yml
          git add public/apply-stage-v3.js public/apply-input-guard-v3.js scripts/check-learning-interaction-ux-v3.js
          git commit -m "fix: keep Apply AI feedback visible after render"
          git push origin HEAD:fix/apply-feedback-persistence
