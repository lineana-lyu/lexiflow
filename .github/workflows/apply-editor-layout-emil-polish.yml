name: Apply editor layout Emil polish

on:
  push:
    branches:
      - feat/editor-layout-emil-polish

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply product patch
        shell: pwsh
        run: python tools/patch_v082.py

      - name: Refresh lockfile
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Validate JavaScript
        shell: pwsh
        run: npm run check

      - name: Validate editor information hierarchy
        shell: pwsh
        run: |
          $app = Get-Content public/app.js -Raw
          $css = Get-Content public/styles.css -Raw
          @('library-editor-identity','library-editor-copy-card','library-editor-image-frame','library-edit-example-en','library-edit-example-zh','library-edit-visual-note','library-editor-footer') | ForEach-Object {
            if (-not $app.Contains($_)) { throw "missing app anchor: $_" }
          }
          @('library-edit-word','library-edit-phonetic','library-edit-pos','library-edit-meaning') | ForEach-Object {
            if ($app.Contains('id="' + $_ + '"')) { throw "lexical identity must not be editable: $_" }
          }
          $imageIndex = $app.IndexOf('library-editor-image-frame')
          $sceneIndex = $app.IndexOf('id="library-edit-visual-note"')
          if ($imageIndex -lt 0 -or $sceneIndex -lt 0 -or $sceneIndex -le $imageIndex) { throw 'scene editor must appear below image card content' }
          @('--ease-out:cubic-bezier(.23,1,.32,1)','lexiCalmEnterForward','.btn:active:not(:disabled)','library-editor-meaning-block') | ForEach-Object {
            if (-not $css.Contains($_)) { throw "missing polish anchor: $_" }
          }

      - name: Build Windows application
        shell: pwsh
        run: npm run build:win

      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(tests?|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.'
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Tracked test/spec/fixture/mock artifacts found'
          }

      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          Remove-Item tools/patch_v082.py -Force
          Remove-Item .github/workflows/apply-editor-layout-emil-polish.yml -Force
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refine: simplify card editor and polish visual hierarchy"
          git push origin HEAD:feat/editor-layout-emil-polish
