name: Apply Codex app-server fast text

on:
  push:
    branches:
      - feat/codex-app-server-fast-review

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/codex-app-server-fast-review
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Normalize patch runner
        shell: pwsh
        run: |
          $path = 'scripts/apply_codex_app_server_fast_review.cjs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('const key = `${model}|${effort || ""}`;', 'const key = model + "|" + (effort || "");')
          $text = $text.Replace('reject(appServerError(`Codex app-server request timed out: ${method}`, "CODEX_APP_SERVER_REQUEST_TIMEOUT"));', 'reject(appServerError("Codex app-server request timed out: " + method, "CODEX_APP_SERVER_REQUEST_TIMEOUT"));')
          Set-Content $path $text -Encoding UTF8

      - name: Apply app-server transport patch
        run: node scripts/apply_codex_app_server_fast_review.cjs

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check

      - name: Validate app-server integration anchors
        shell: pwsh
        run: |
          $server = Get-Content server.js -Raw
          foreach ($needle in @('app-server", "--listen", "stdio://', 'thread/start', 'turn/start', 'item/agentMessage/delta', 'fastTextTransport: appServerPublicStatus()', 'provider: result.transport === "app-server"')) {
            if (-not $server.Contains($needle)) { throw "Missing app-server integration anchor: $needle" }
          }

      - name: Build Windows application
        run: npm run build:win

      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(test|tests|__tests__)(/|$)|\.(test|spec)\.|(^|/)(fixtures?|mocks?)(/|$)'
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Test/spec/fixture/mock artifacts are not allowed in this project.'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-Windows-v0.6.1-app-server
          path: dist/*.exe
          if-no-files-found: error

      - name: Remove temporary patch files and commit
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-codex-app-server-fast-review.yml'
          Remove-Item 'scripts/apply_codex_app_server_fast_review.cjs'
          if (Test-Path 'scripts' -PathType Container) {
            if (-not (Get-ChildItem 'scripts' -Force)) { Remove-Item 'scripts' }
          }
          git config user.name 'LexiFlow Feature Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'No changes produced by app-server migration.' }
          git commit -m 'perf: reuse Codex app-server for fast text tasks'
          git push origin HEAD:feat/codex-app-server-fast-review
