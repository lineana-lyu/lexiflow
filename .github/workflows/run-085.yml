name: Validate LexiFlow v0.8.5 refinement

on:
  push:
    branches:
      - refine/quiet-ui-visual-qa-085

permissions:
  contents: write

jobs:
  refine:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refine/quiet-ui-visual-qa-085
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/apply_085.py
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Validate product guards
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const a=fs.readFileSync('public/app.js','utf8');const s=fs.readFileSync('server.js','utf8');if(a.includes('AI 联想场景')||a.includes('✦ AI 帮我看看'))process.exit(1);if(!a.includes('draftFollowedSuggestion')||!s.includes('天然文字很多的构图'))process.exit(1);"
      - name: Build Windows app
        run: npm run build:win
      - name: Check no test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)(tests?|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.' }
          if ($bad) { $bad; exit 1 }
      - name: Commit refinement
        shell: pwsh
        run: |
          git config user.name "LexiFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-085.yml
          git rm .github/scripts/apply_085.py
          git add server.js public/app.js public/styles.css package.json package-lock.json
          git commit -m "refine: quiet the learning UI and harden visual scenes"
          git push origin HEAD:refine/quiet-ui-visual-qa-085
