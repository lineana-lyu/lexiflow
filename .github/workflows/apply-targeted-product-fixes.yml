name: Apply targeted LexiFlow product fixes

on:
  push:
    branches:
      - fix/dictionary-learning-flow

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dictionary-learning-flow
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply targeted source fixes
        run: python scripts/apply-targeted-product-fixes.py

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/example-hydration.js lib/ecdict.js server-runtime.js server.js
          git diff --cached --check
          git commit -m "fix: align dictionary and learning flow behavior"
          git push origin HEAD:fix/dictionary-learning-flow
