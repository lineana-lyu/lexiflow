name: Apply targeted LexiFlow product fixes

on:
  push:
    branches:
      - fix/dictionary-learning-flow

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dictionary-learning-flow
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply targeted source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-targeted-product-fixes.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('if count != 1:\n        raise RuntimeError(f"{label}: expected exactly 1 match in {path}, got {count}")', 'if count < 1:\n        raise RuntimeError(f"{label}: expected at least 1 match in {path}, got {count}")', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/apply-targeted-product-fixes.py

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/example-hydration.js lib/ecdict.js server-runtime.js server.js
          git diff --cached --check
          git commit -m "fix: align dictionary and learning flow behavior"
          git push origin HEAD:fix/dictionary-learning-flow
