name: Apply LexiFlow Core v2 runtime

on:
  push:
    branches:
      - feat/local-core-lexicon-v2

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/local-core-lexicon-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch runtime
        run: python scripts/apply-core-runtime-v2.py
      - name: Build local dictionaries
        run: npm run prepare:dictionary
      - name: Benchmark local core
        run: node scripts/benchmark-core-lexicon.js
      - name: Syntax check
        run: npm run check
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-runtime.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime patch to commit"
          else
            git commit -m "feat: route lookup through LexiFlow Core v2"
            git push origin HEAD:feat/local-core-lexicon-v2
          fi
