name: Validate Kokoro Windows

on:
  push:
    branches:
      - feat/kokoro-local-tts

jobs:
  kokoro-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/kokoro-local-tts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Synthesize with Bella locally
        shell: pwsh
        env:
          LEXIFLOW_DATA_DIR: ${{ runner.temp }}\lexiflow-data
        run: |
          node -e "const t=require('./lib/kokoro-tts'); t.synthesize('LexiFlow helps me speak English with confidence.',{voice:'af_bella'}).then(r=>{console.log('voice='+r.voice,'bytes='+r.dataUrl.length,'cacheHit='+r.cacheHit); if(!r.dataUrl.startsWith('data:audio/wav;base64,')) process.exit(2)}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify cached replay
        shell: pwsh
        env:
          LEXIFLOW_DATA_DIR: ${{ runner.temp }}\lexiflow-data
        run: |
          node -e "const t=require('./lib/kokoro-tts'); t.synthesize('LexiFlow helps me speak English with confidence.',{voice:'af_bella'}).then(r=>{console.log('cacheHit='+r.cacheHit); if(!r.cacheHit) process.exit(3)}).catch(e=>{console.error(e);process.exit(1)})"
