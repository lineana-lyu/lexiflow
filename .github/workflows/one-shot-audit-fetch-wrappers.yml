name: One-shot Audit Fetch Wrappers

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-audit-fetch-wrappers.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Audit global fetch wrappers and learning-data bypasses
        shell: bash
        run: |
          echo '=== GLOBAL FETCH ASSIGNMENTS ==='
          grep -RInE 'window\.fetch[[:space:]]*=' public --include='*.js' || true
          echo
          echo '=== FETCH ALIASES / PREVIOUS FETCH ==='
          grep -RInE '(previousFetch|upstreamFetch|dataFetch)[[:space:]]*=' public --include='*.js' || true
          echo
          echo '=== LEARNING DATA DIRECT POSTS ==='
          grep -RIn '/api/learning-data' public --include='*.js' | grep -E 'POST|method' || true
          echo
          echo '=== MUTATION OBSERVERS NEAR REFRESH ==='
          grep -RInE 'MutationObserver|await refresh\(|void refresh\(' public --include='*.js' || true
