name: One-shot Settings Decorator Redundancy

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-settings-decorator-redundancy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Remove redundant Settings decorators
        run: python scripts/cleanup-settings-decorator-redundancy.py
      - name: Verify cleanup
        run: |
          node --check public/app.js
          node --check public/settings-surface.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/settings-surface.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: remove redundant Settings surface decorators [settings-decorator-cut]"
          git push origin HEAD:feat/v7-airy-luminous-ui
