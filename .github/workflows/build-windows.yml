name: Build LexiFlow for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - electron-main.js
      - server.js
      - server-entry.js
      - lib/**
      - scripts/**
      - public/**
      - build/**
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/build-windows.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - electron-main.js
      - server.js
      - server-entry.js
      - lib/**
      - scripts/**
      - public/**
      - build/**
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Build Windows application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-Windows
          path: dist/*.exe
          if-no-files-found: error
