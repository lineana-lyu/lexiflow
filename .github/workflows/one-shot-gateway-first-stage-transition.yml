name: One-shot Gateway-first Stage Transition

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-gateway-first-stage-transition.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Prefer Gateway snapshot for Stage Transition reads
        run: python scripts/gateway-first-stage-transition.py
      - name: Verify migration
        run: |
          node --check public/stage-transition-v3.js
          node --check scripts/check-stage-commands-v3.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/stage-transition-v3.js scripts/check-stage-commands-v3.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: prefer Gateway snapshot for stage transitions [gateway-first-stage-transition]"
          git push origin HEAD:feat/v7-airy-luminous-ui
