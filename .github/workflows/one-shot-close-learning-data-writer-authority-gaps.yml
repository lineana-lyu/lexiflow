name: One-shot Close Learning Data Writer Authority Gaps

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-close-learning-data-writer-authority-gaps.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Close learning-data writer authority gaps
        run: python scripts/close-learning-data-writer-authority-gaps.py
      - name: Verify migration
        run: |
          node --check public/app.js
          node --check public/new-user-defaults-v3.js
          node --check public/review-policy-v3.js
          node --check scripts/check-learning-data-gateway-v3.js
          node --check scripts/check-review-policy-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/new-user-defaults-v3.js public/review-policy-v3.js scripts/check-learning-data-gateway-v3.js scripts/check-review-policy-v3.js
          git commit -m "fix: close learning-data writer authority gaps [writer-authority]"
          git push origin HEAD:feat/v7-airy-luminous-ui
