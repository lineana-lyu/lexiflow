name: Tmp Direct Select V4

on:
  push:
    branches:
      - tmp-direct-select-audio-icon-v4

permissions:
  contents: write

jobs:
  migrate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply migration
        run: python3 scripts/migrate-direct-select-audio-v4.py
      - name: Check touched JavaScript
        run: |
          node --check public/app.js
          node --check public/today-plan-v3.js
          node --check public/stage-transition-v3.js
          node --check public/select-stage-v3.js
          node --check scripts/check-direct-select-v4.js
      - name: Run repository checks
        run: npm run check
      - name: Commit verified business changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/today-plan-v3.js public/stage-transition-v3.js public/select-stage-v3.js scripts/check-direct-select-v4.js package.json
          if git diff --cached --quiet; then
            echo "No business changes to commit"
          else
            git commit -m "feat: streamline new-word selection and unify study audio"
            git push origin HEAD:tmp-direct-select-audio-icon-v4
          fi
