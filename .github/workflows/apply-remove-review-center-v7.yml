name: Apply Remove Review Center V7

on:
  push:
    branches:
      - tmp/remove-review-center-v7-final6
    paths:
      - scripts/apply-remove-review-center-v7.py
      - .github/workflows/apply-remove-review-center-v7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: tmp/remove-review-center-v7-final6
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply product navigation change
        run: python scripts/apply-remove-review-center-v7.py
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Commit verified change and remove one-shot files
        run: |
          rm -f scripts/apply-remove-review-center-v7.py .github/workflows/apply-remove-review-center-v7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js scripts/check-user-surface-v4.js
          git add -u scripts/apply-remove-review-center-v7.py .github/workflows/apply-remove-review-center-v7.yml
          git commit -m "refactor: make Today the single review entry"
          git push origin HEAD:tmp/remove-review-center-v7-final6
