name: One-shot Explicit Example Hydration

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-explicit-example-hydration.yml
      - scripts/make-example-hydration-explicit.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Make example hydration explicit
        run: python scripts/make-example-hydration-explicit.py
      - name: Verify migration
        shell: bash
        run: |
          node --check public/example-hydration.js
          node --check public/app.js
          node --check scripts/check-runtime-cleanup-v3.js
          ! grep -q 'window.fetch = async function lexiFlowExampleAwareFetch' public/example-hydration.js
          grep -q 'LexiFlowExampleHydration=Object.freeze({processPayload})' public/example-hydration.js
          grep -q 'LexiFlowExampleHydration?.processPayload?.(path,payload)' public/app.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/example-hydration.js public/app.js scripts/check-runtime-cleanup-v3.js
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 0; }
          git commit -m "refactor: make example hydration an explicit bridge [example-hydration]"
          git push origin HEAD:feat/v7-airy-luminous-ui
