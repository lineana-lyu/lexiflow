name: Study Renderer Migration

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-study-renderer-v3-patch.js

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Patch app renderer
        run: node scripts/apply-study-renderer-v3-patch.js
      - name: Verify patched app syntax
        run: node --check public/app.js
      - name: Commit migration and remove one-shot files
        shell: bash
        run: |
          rm scripts/apply-study-renderer-v3-patch.js
          rm .github/workflows/study-renderer-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: expose explicit Study renderer bridge"
          git push origin HEAD:feat/v7-airy-luminous-ui
