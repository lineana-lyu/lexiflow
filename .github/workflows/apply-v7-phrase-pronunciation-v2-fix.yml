name: Apply V7 Phrase Pronunciation V2 Fix

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/apply-v7-phrase-pronunciation-v2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V7
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply audited phrase pronunciation repair
        run: python scripts/apply-v7-phrase-pronunciation-v2-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dictionaries with phrase IPA validation
        run: |
          node scripts/prepare-ecdict.js
          node scripts/prepare-core-lexicon.js
          node scripts/prepare-phrase-dictionary.js --force --required
          node - <<'NODE'
          const assert = require('assert');
          const phrases = require('./lib/phrase-dictionary');
          const look = phrases.lookupExact('look forward to');
          assert(look, 'look forward to must resolve from the phrase dictionary');
          assert.strictEqual(String(look.word || '').toLowerCase(), 'look forward to');
          assert(/期待|盼望/.test(String(look.senses?.[0]?.meaningZh || '')), 'look forward to must keep phrase semantics');
          const ipa = String(look.phonetic || '');
          assert(!ipa || ipa.replace(/^\/+|\/+$/g, '').trim().split(/\s+/).length >= 3, 'phrase dictionary must never expose a one-word IPA for look forward to');
          console.log('look forward to phrase row:', { meaning: look.senses?.[0]?.meaningZh || '', phonetic: ipa || '(runtime compose required)' });
          NODE

      - name: Run repository checks
        run: npm run check

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f scripts/apply-v7-phrase-pronunciation-v2-fix.py .github/workflows/apply-v7-phrase-pronunciation-v2-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare-phrase-dictionary.js lib/phrase-dictionary.js server-runtime.js public/app.js scripts/check-phrase-dictionary-v5.js scripts/check-user-surface-v4.js
          git add -u scripts/apply-v7-phrase-pronunciation-v2-fix.py .github/workflows/apply-v7-phrase-pronunciation-v2-fix.yml
          git commit -m "fix: guarantee whole-phrase IPA and playback"
          git push origin HEAD:feat/v7-airy-luminous-ui
