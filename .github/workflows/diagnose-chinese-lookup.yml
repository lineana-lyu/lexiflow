name: Validate Settings and Chinese Lookup

on:
  push:
    branches:
      - fix/settings-startup-and-chinese-accuracy

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/settings-startup-and-chinese-accuracy
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply targeted patch
        run: python scripts/apply-settings-chinese-accuracy-fix.py
      - name: Syntax check
        run: npm run check
      - name: Verify passive status path is non-blocking by construction
        shell: pwsh
        run: |
          $app = Get-Content public/app.js -Raw
          if ($app -match 'await hydrateLearningData\(\);\s*render\(\);\s*await refreshProviderStatus\(true\);') { throw 'startup still waits for provider status' }
          if ($app.Contains('if(state.route==="add") refreshProviderStatus(true);')) { throw 'route navigation still auto-probes provider status' }
          $server = Get-Content server.js -Raw
          if ($server.Contains('spawnSync')) { throw 'server still contains spawnSync' }
          if (-not $server.Contains('commandAvailableWithoutSpawn')) { throw 'non-blocking Codex status detector missing' }
      - name: Build local dictionaries
        run: npm run prepare:dictionary
      - name: Validate Chinese lookup quality
        shell: pwsh
        run: |
          @'
          const core=require('./lib/core-lexicon');
          const expected=new Map([
            ['苹果','apple'],
            ['键盘','keyboard'],
            ['银行','bank'],
            ['改善','improve'],
            ['挑战','challenge'],
            ['释放','release'],
            ['支持','support'],
            ['地址','address'],
            ['方法','method'],
          ]);
          for(const [query,word] of expected){
            const result=core.lookupChinese(query);
            console.log(query,JSON.stringify({word:result?.word,meaning:result?.senses?.[0]?.meaningZh,gloss:result?.senses?.[0]?.glossZh,alts:result?.alternatives}));
            if(result?.word!==word) throw new Error(`${query}: expected ${word}, got ${result?.word}`);
            if(result?.senses?.[0]?.meaningZh!==query) throw new Error(`${query}: selected sense does not match query`);
          }
          const suitable=core.lookupChinese('适合');
          console.log('适合',JSON.stringify(suitable));
          if(!['suit','fit'].includes(suitable?.word)) throw new Error(`适合: expected suit/fit, got ${suitable?.word}`);
          if(suitable?.senses?.[0]?.meaningZh!=='适合') throw new Error('适合: wrong sense selected');
          if(!suitable?.chineseSenseMatched) throw new Error('适合: semantic sense match missing');

          const hair=core.lookupChinese('发卡');
          console.log('发卡',JSON.stringify(hair));
          if(!hair?.word) throw new Error('发卡: no result');
          if(hair.word==='chuck') throw new Error('发卡 must never collapse to later slang gloss chuck');
          const words=[hair.word,...(hair.alternatives||[]).map(x=>x.word)];
          if(!words.some(x=>/hair[ -](?:grip|clip)/i.test(x))) throw new Error(`发卡: hair-clip sense missing: ${words.join(', ')}`);
          if(!words.some(x=>/issue.*card/i.test(x))) throw new Error(`发卡: issue-a-card sense missing: ${words.join(', ')}`);
          core.close();
          '@ | Set-Content -Encoding UTF8 .tmp-chinese-quality.js
          node .tmp-chinese-quality.js
          Remove-Item .tmp-chinese-quality.js
      - name: Verify status endpoint latency
        shell: pwsh
        run: |
          $env:LEXIFLOW_PORT='4197'
          $env:LEXIFLOW_NO_OPEN='1'
          $proc = Start-Process node -ArgumentList 'server-runtime.js' -PassThru -NoNewWindow
          try {
            $ready=$false
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 150
              try { Invoke-RestMethod 'http://127.0.0.1:4197/api/health' -TimeoutSec 1 | Out-Null; $ready=$true; break } catch {}
            }
            if(-not $ready){ throw 'server did not become ready' }
            $sw=[System.Diagnostics.Stopwatch]::StartNew()
            $status=Invoke-RestMethod 'http://127.0.0.1:4197/api/status' -TimeoutSec 3
            $sw.Stop()
            Write-Host "status latency: $($sw.ElapsedMilliseconds)ms"
            if($sw.ElapsedMilliseconds -gt 1500){ throw "status endpoint blocked for $($sw.ElapsedMilliseconds)ms" }
            if(-not $status.ok){ throw 'status endpoint returned not ok' }
          } finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force }
          }
      - name: Diff check
        run: git diff --check
      - name: Commit validated code changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server.js lib/core-lexicon.js scripts/prepare-core-lexicon.js
          if (git diff --cached --quiet) {
            Write-Host 'No generated code changes'
          } else {
            git commit -m 'fix: unblock settings and improve Chinese lookup semantics'
            git push origin HEAD:fix/settings-startup-and-chinese-accuracy
          }
