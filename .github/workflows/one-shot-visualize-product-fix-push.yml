name: One-shot Visualize product fix push

on:
  push:
    branches:
      - fix/visualize-user-scene-and-background-generation
    paths:
      - .github/workflows/one-shot-visualize-product-fix-push.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/visualize-user-scene-and-background-generation
          fetch-depth: 0

      - name: Execute product patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/one-shot-visualize-product-fix.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          raw=source[start:end].splitlines()
          code="\n".join(line[10:] if line.startswith("          ") else line for line in raw)
          exec(compile(code,'visualize-product-fix','exec'),{})

          renderer_path=Path('scripts/check-stage-renderers-v3.js')
          renderer=renderer_path.read_text(encoding='utf-8')
          old_renderer='assert(visual.includes("previousScene:note"),"Visualize AI assistance must refine the learner\'s existing association instead of inventing the first one");'
          new_renderer='assert(visual.includes("userScene:note"),"Visualize AI assistance must anchor refinement on the learner\'s own scene instead of treating it as an old scene to avoid");'
          if old_renderer not in renderer:
              raise SystemExit('renderer user-scene assertion target not found')
          renderer_path.write_text(renderer.replace(old_renderer,new_renderer,1),encoding='utf-8')

          commands_path=Path('scripts/check-stage-commands-v3.js')
          commands=commands_path.read_text(encoding='utf-8')
          command_replacements={
            'assert(transition.includes(\'appendActivity(data,card.id,"visualize",{skipped:false,imageConfirmed:true,nextStage:"apply",commandId})\'),"normal Visualize completion must persist its shared command ID and image confirmation outcome");':
            'assert(transition.includes(\'appendActivity(data,card.id,"visualize",{skipped:false,imageConfirmed:hasImage,imagePending:!hasImage&&imagePending,nextStage:"apply",commandId})\'),"Visualize completion must persist its shared command ID plus completed-vs-pending image outcome");',
            'assert(transition.includes("card.visualImageConfirmed=true"),"Visualize image must become confirmed only in terminal Visualize completion");':
            'assert(transition.includes("card.visualImageConfirmed=hasImage"),"Visualize completion must confirm only an image that already exists, while allowing a pending background image");'
          }
          for old,new in command_replacements.items():
              if old not in commands:
                  raise SystemExit('stage-command assertion target not found: '+old[:80])
              commands=commands.replace(old,new,1)
          commands_path.write_text(commands,encoding='utf-8')

          isolation_path=Path('scripts/check-visualize-input-isolation-v3.js')
          isolation=isolation_path.read_text(encoding='utf-8')
          old_isolation='assert(guard.includes("drafts.set(cardId,String(input.value||\\\"\\\"));"),"Visualize input guard must retain the current draft across incidental remounts");'
          new_isolation='assert(guard.includes("setDraft(cardId,input.value);")&&guard.includes("function clearDraft(cardId)"),"Visualize input guard must retain the current draft through the shared draft authority and be able to clear stale residue");'
          if old_isolation not in isolation:
              raise SystemExit('input isolation draft assertion target not found')
          isolation_path.write_text(isolation.replace(old_isolation,new_isolation,1),encoding='utf-8')
          PY

      - name: Validate product fix
        run: |
          node --check public/ai-assist-v3.js
          node --check public/visualize-input-guard-v3.js
          node --check public/visualize-stage-v3.js
          node --check public/visualize-actions-v3.js
          node --check public/stage-transition-v3.js
          node --check server.js
          node --check scripts/check-stage-renderers-v3.js
          node --check scripts/check-stage-commands-v3.js
          node --check scripts/check-visualize-input-isolation-v3.js
          node scripts/check-visualize-product-flow-v3.js
          npm run check:learning

      - name: Commit product fix and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/one-shot-visualize-product-fix.yml
          rm .github/workflows/one-shot-visualize-product-fix-push.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Visualize with user scene and background generation"
          git push origin HEAD:fix/visualize-user-scene-and-background-generation
