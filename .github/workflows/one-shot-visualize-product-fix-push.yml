name: One-shot Visualize product fix push

on:
  push:
    branches:
      - fix/visualize-user-scene-and-background-generation
    paths:
      - .github/workflows/one-shot-visualize-product-fix-push.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/visualize-user-scene-and-background-generation
          fetch-depth: 0

      - name: Execute product patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/one-shot-visualize-product-fix.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          raw=source[start:end].splitlines()
          code="\n".join(line[10:] if line.startswith("          ") else line for line in raw)
          exec(compile(code,'visualize-product-fix','exec'),{})

          check_path=Path('scripts/check-stage-renderers-v3.js')
          check=check_path.read_text(encoding='utf-8')
          old='assert(visual.includes("previousScene:note"),"Visualize AI assistance must refine the learner\'s existing association instead of inventing the first one");'
          new='assert(visual.includes("userScene:note"),"Visualize AI assistance must anchor refinement on the learner\'s own scene instead of treating it as an old scene to avoid");'
          if old not in check:
              raise SystemExit('renderer user-scene assertion target not found')
          check_path.write_text(check.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate product fix
        run: |
          node --check public/ai-assist-v3.js
          node --check public/visualize-input-guard-v3.js
          node --check public/visualize-stage-v3.js
          node --check public/visualize-actions-v3.js
          node --check public/stage-transition-v3.js
          node --check server.js
          node --check scripts/check-stage-renderers-v3.js
          node scripts/check-visualize-product-flow-v3.js
          npm run check:learning

      - name: Commit product fix and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/one-shot-visualize-product-fix.yml
          rm .github/workflows/one-shot-visualize-product-fix-push.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Visualize with user scene and background generation"
          git push origin HEAD:fix/visualize-user-scene-and-background-generation
