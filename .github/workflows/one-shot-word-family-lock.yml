name: One-shot Word Family Lock

on:
  push:
    branches:
      - fix/apply-rounds-word-family-v2
    paths:
      - .github/workflows/one-shot-word-family-lock.yml

permissions:
  contents: write

jobs:
  update-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/apply-rounds-word-family-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Install and update lockfile
        run: npm install --no-audit --no-fund
      - name: Verify discipline word family
        run: |
          node <<'NODE'
          const family=require('./lib/word-family');
          (async()=>{
            const value=await family.lookup('discipline');
            console.log(JSON.stringify(value,null,2));
            const byPos=Object.fromEntries(value.map(group=>[group.pos,group.words]));
            if(!byPos.noun?.includes('discipline')) throw new Error('discipline noun missing');
            if(!byPos.verb?.includes('discipline')) throw new Error('discipline verb missing');
            if(!byPos.adjective?.length) throw new Error('discipline adjective family missing');
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Run repository checks
        run: npm run check
      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "lexiflow-product-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-word-family-lock.yml
          git add package.json package-lock.json
          git commit -m "build: lock offline WordNet dependency"
          git push origin HEAD:fix/apply-rounds-word-family-v2
