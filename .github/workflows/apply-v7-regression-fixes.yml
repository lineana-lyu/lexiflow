name: Apply V7 Regression Fixes

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-v7-regression-fixes.js
      - .github/workflows/apply-v7-regression-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V7
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply source patch
        run: node scripts/apply-v7-regression-fixes.js
      - name: Run repository checks
        run: npm run check
      - name: Commit patched sources and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-v7-regression-fixes.js .github/workflows/apply-v7-regression-fixes.yml
          git add public/app.js public/product-ux.js public/memorize-stage-v3.js public/study-session-v3.js public/review-session-v3.js public/example-hydration.js scripts/check-expression-query-v4.js scripts/check-study-session-v3.js
          git commit -m "fix: restore phrase pronunciation and spaced recall flow"
          git push origin HEAD:feat/v7-airy-luminous-ui
