name: One Shot V7 Intake Pronunciation

on:
  push:
    branches:
      - tmp-v7-intake-pron-icon-20260913

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python3 scripts/migrate-v7-intake-pronunciation.py
      - name: Syntax check touched runtime files
        run: |
          node --check public/app.js
          node --check public/today-plan-v3.js
          node --check public/select-stage-v3.js
          node --check scripts/check-today-plan-v3.js
          node --check scripts/check-select-stage-v3.js
      - name: Run repository checks
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run check
      - name: Commit verified business changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/today-plan-v3.js public/select-stage-v3.js scripts/check-today-plan-v3.js scripts/check-select-stage-v3.js
          if git diff --cached --quiet; then
            echo "No business changes to commit"
            exit 0
          fi
          git commit -m "fix: simplify Today intake and unify Select pronunciation"
          git push origin HEAD:tmp-v7-intake-pron-icon-20260913
