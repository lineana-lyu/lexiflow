name: One-shot Study Shell State Cut

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-study-shell-state-cut.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Narrow Study shell state
        run: python scripts/cleanup-study-shell-state.py
      - name: Verify cleanup
        run: |
          node --check public/app.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: narrow app study shell state [study-shell-state-cut]"
          git push origin HEAD:feat/v7-airy-luminous-ui
