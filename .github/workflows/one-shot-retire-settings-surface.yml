name: One-shot Retire Settings Surface

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-retire-settings-surface.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Retire Settings mutation decorator
        run: python scripts/retire-settings-surface.py
      - name: Verify retirement
        run: |
          node --check public/app.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit retirement
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/app.js public/index.html public/settings-surface.js package.json scripts/check-runtime-authority-v3.js
          git commit -m "refactor: retire Settings mutation decorator [settings-surface-retire]"
          git push origin HEAD:feat/v7-airy-luminous-ui
