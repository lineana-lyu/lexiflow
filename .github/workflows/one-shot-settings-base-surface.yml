name: One-shot Settings Base Surface

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-settings-base-surface.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Align Settings base surface
        run: python scripts/cleanup-settings-base-surface.py
      - name: Verify cleanup
        run: |
          node --check public/app.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: align Settings base surface with current product [settings-base-surface]"
          git push origin HEAD:feat/v7-airy-luminous-ui
