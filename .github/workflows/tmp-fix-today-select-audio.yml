name: Tmp Fix Today Select Audio
on:
  push:
    branches:
      - tmp-today-select-audio-fix-20260913b
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply guarded migration
        run: python3 scripts/tmp-fix-today-select-audio.py
      - name: Syntax checks
        run: |
          node --check public/app.js
          node --check public/today-plan-v3.js
          node --check public/select-stage-v3.js
          node --check scripts/check-today-plan-v3.js
          node --check scripts/check-stage-renderers-v3.js
      - name: Run repository checks
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run check
      - name: Commit validated business changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/today-plan-v3.js public/select-stage-v3.js scripts/check-today-plan-v3.js scripts/check-stage-renderers-v3.js
          if git diff --cached --quiet; then
            echo "No business changes to commit"
            exit 0
          fi
          git commit -m "fix: streamline Today word selection and unify pronunciation"
          git push
