name: Apply UI polish round 2

on:
  push:
    branches:
      - feat/ui-polish-round2
    paths:
      - scripts/apply-ui-round2.py
      - .github/workflows/apply-ui-round2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ui-polish-round2
          fetch-depth: 0

      - name: Apply UI polish
        run: python scripts/apply-ui-round2.py

      - name: Static validation
        run: |
          node --check server.js
          node --check public/app.js
          git diff --check

      - name: Ensure no test artifacts were added
        shell: bash
        run: |
          if find . -type f \( -name '*.test.*' -o -name '*.spec.*' -o -iname '*fixture*' -o -iname '*mock*' \) -not -path './.git/*' | grep -q .; then
            echo 'Unexpected test/mock artifact found'
            exit 1
          fi

      - name: Remove temporary runner
        run: |
          rm -f scripts/apply-ui-round2.py
          rm -f .github/workflows/apply-ui-round2.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit UI polish
        run: |
          git config user.name 'LexiFlow UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: polish learning-first interface'
          git push origin HEAD:feat/ui-polish-round2
