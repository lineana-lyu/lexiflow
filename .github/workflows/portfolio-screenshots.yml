name: Portfolio Runtime Screenshots

on:
  push:
    branches:
      - portfolio-runtime-capture
    paths:
      - ".github/workflows/portfolio-screenshots.yml"
      - "scripts/capture-portfolio-screenshots.cjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start LexiFlow web runtime
        env:
          LEXIFLOW_NO_OPEN: "1"
        run: |
          npm run web > /tmp/lexiflow-web.log 2>&1 &
          echo $! > /tmp/lexiflow-web.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4177/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lexiflow-web.log
          exit 1

      - name: Capture actual product pages
        run: timeout 120s node scripts/capture-portfolio-screenshots.cjs

      - name: Commit screenshots to capture branch
        if: always()
        run: |
          if compgen -G "portfolio-screenshots/*.png" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio-screenshots/*.png
            git commit -m "chore: capture actual LexiFlow portfolio screens" || true
            git push
          fi

      - name: Show runtime log
        if: always()
        run: cat /tmp/lexiflow-web.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexiflow-portfolio-screenshots
          path: portfolio-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
