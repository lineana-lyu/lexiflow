name: Extend depth transitions to review

on:
  push:
    branches:
      - feat/depth-study-transitions

permissions:
  contents: write

jobs:
  extend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Apply review transition patch
        shell: pwsh
        run: python tools/extend_depth_to_review.py
      - name: Install dependencies
        shell: pwsh
        run: npm ci
      - name: Validate JavaScript
        shell: pwsh
        run: npm run check
      - name: Validate review motion anchors
        shell: pwsh
        run: |
          $app = Get-Content public/app.js -Raw
          $css = Get-Content public/styles.css -Raw
          if ($app -notmatch 'key:`review:') { throw 'review motion snapshot missing' }
          if ($app -notmatch 'review-depth-stage') { throw 'review depth shell missing' }
          if ($css -notmatch '::view-transition-old\(root\)') { throw 'root transition stabilization missing' }
          if ($css -notmatch 'review-depth-stage') { throw 'review depth styles missing' }
      - name: Build Windows application
        shell: pwsh
        run: npm run build:win
      - name: Verify no tracked test artifacts
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(test|tests|__tests__|fixtures?|mocks?)(/|$)|\.(test|spec)\.'
          if ($bad) { $bad | Write-Host; throw 'tracked test/spec/fixture/mock files found' }
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          git rm tools/extend_depth_to_review.py
          git rm .github/workflows/extend-depth-to-review.yml
          git config user.name "lineana"
          git config user.email "17570875940@163.com"
          git add public/app.js public/styles.css
          git commit -m "refine: extend depth transitions to review cards"
          git push origin HEAD:feat/depth-study-transitions
