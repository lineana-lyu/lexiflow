name: One-shot Stage Renderer Writer Resync

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-stage-renderer-writer-resync.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Resync renderer writes from Gateway after POST
        run: python scripts/resync-stage-renderer-writers.py
      - name: Verify migration
        run: |
          node --check public/visualize-stage-v3.js
          node --check public/apply-stage-v3.js
          node --check scripts/check-stage-renderers-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/visualize-stage-v3.js public/apply-stage-v3.js scripts/check-stage-renderers-v3.js
          git commit -m "refactor: resync stage renderers from Gateway [renderer-writer-resync]"
          git push origin HEAD:feat/v7-airy-luminous-ui
