name: Apply V7 Memorize Rotation State Fix

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-v7-memorize-saving-fix.js
      - .github/workflows/apply-v7-memorize-saving-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V7
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply state fix
        run: node scripts/apply-v7-memorize-saving-fix.js
      - name: Run repository checks
        run: npm run check
      - name: Commit fix and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-v7-memorize-saving-fix.js .github/workflows/apply-v7-memorize-saving-fix.yml
          git add public/memorize-stage-v3.js
          git commit -m "fix: release memorize save lock before rotating cards"
          git push origin HEAD:feat/v7-airy-luminous-ui
