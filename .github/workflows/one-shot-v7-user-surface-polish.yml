name: One Shot V7 User Surface Polish

on:
  push:
    branches:
      - tmp-v7-user-surface-polish
    paths:
      - .github/workflows/one-shot-v7-user-surface-polish.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v7-user-surface-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Apply user surface migration
        run: |
          python3 scripts/migrate-v7-user-surface-polish.py
          python3 scripts/migrate-v7-user-surface-contract-fix.py
      - name: Verify touched JavaScript
        run: |
          node --check public/app.js
          node --check public/review-policy-v3.js
          node --check public/review-session-v3.js
          node --check public/source-context-v3.js
          node --check public/example-hydration.js
          node --check lib/example-enrichment.js
          node --check electron-main.js
          node --check scripts/check-review-policy-v3.js
          node --check scripts/check-user-surface-v4.js
          node --check scripts/check-learning-engine-v3.js
          node --check scripts/check-runtime-authority-v3.js
      - name: Run full repository checks
        run: |
          set +e
          npm run check > user-surface-check-debug.txt 2>&1
          code=$?
          cat user-surface-check-debug.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add user-surface-check-debug.txt
            git commit -m "chore: capture user surface check failure"
            git push origin HEAD:tmp-v7-user-surface-polish
            exit "$code"
          fi
          rm -f user-surface-check-debug.txt
      - name: Commit verified business files
        run: |
          FILES="public/app.js public/review-policy-v3.js public/review-session-v3.js public/source-context-v3.js public/theme-v7.css public/example-hydration.js lib/example-enrichment.js electron-main.js scripts/check-review-policy-v3.js scripts/check-user-surface-v4.js scripts/check-learning-engine-v3.js scripts/check-runtime-authority-v3.js package.json"
          if git diff --quiet -- $FILES; then
            echo "No business changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "feat: polish user-facing settings and learning stats"
          git push origin HEAD:tmp-v7-user-surface-polish
# rerun after learner-facing Review authority alignment
