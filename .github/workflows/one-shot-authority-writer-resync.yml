name: One-shot Authority Writer Resync

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-authority-writer-resync.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Resync authority writers from Gateway after POST
        run: python scripts/resync-authority-writers-after-post.py
      - name: Verify migration
        run: |
          node --check public/review-session-v3.js
          node --check public/today-plan-v3.js
          node --check scripts/check-review-session-v3.js
          node --check scripts/check-today-plan-v3.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/review-session-v3.js public/today-plan-v3.js scripts/check-review-session-v3.js scripts/check-today-plan-v3.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: resync authority writers from Gateway after persist [writer-resync]"
          git push origin HEAD:feat/v7-airy-luminous-ui
