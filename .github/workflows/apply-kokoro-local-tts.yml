name: Apply Kokoro local TTS

on:
  push:
    branches:
      - feat/kokoro-local-tts

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/kokoro-local-tts
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Install Kokoro runtime
        run: npm install kokoro-js@1.2.1 --save
      - name: Apply integration patch
        run: python scripts/apply-kokoro-local-tts.py
      - name: Verify Kokoro module
        run: node -e "const k=require('kokoro-js'); console.log('KokoroTTS:', typeof k.KokoroTTS, 'cache env:', typeof k.env)"
      - name: Syntax check
        run: npm run check
      - name: Diff check
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server-runtime.js public/app.js public/index.html
          if git diff --cached --quiet; then
            echo "No generated integration changes to commit"
          else
            git commit -m "feat: switch local fallback voice to Kokoro ONNX"
            git push origin HEAD:feat/kokoro-local-tts
          fi
