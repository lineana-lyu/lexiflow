name: One-shot Publish LexiFlow v0.8.5

on:
  push:
    branches:
      - release/v0.8.5-publish
    paths:
      - .github/workflows/one-shot-publish-v0.8.5.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 9e7d74dde97bba38630c1668efa73c9559982fb8
      BUILD_RUN_ID: "34937534638"
      LEARNING_RUN_ID: "34937534558"
      TAG: v0.8.5
    steps:
      - name: Wait for release-candidate checks
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$LEARNING_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run watch "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download unsigned Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name LexiFlow-Windows --dir release-assets
          find release-assets -maxdepth 2 -type f -print
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"

      - name: Verify release target is current main
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Create public unsigned release and tag
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          ## LexiFlow v0.8.5

          This is LexiFlow's first public downloadable release and the public baseline for the project's code-signing application.

          ### Windows downloads
          - Installer (`LexiFlow Setup 0.8.5.exe`)
          - Portable executable (`LexiFlow 0.8.5.exe`)

          **Signing status:** these Windows binaries are intentionally **unsigned**. Until the SignPath Foundation application is approved and the signing workflow is enabled, Windows may show an Unknown Publisher / SmartScreen warning.

          The release artifacts were built automatically from the tagged `main` commit by the repository's Windows build workflow with automatic certificate discovery disabled.

          ### Highlights
          - Local-first dictionary and learning data flow
          - Five-stage learning workflow with daily planning and review
          - Natural local Kokoro speech fallback and pronunciation support
          - Windows desktop packaging with installer and portable builds
          - Public Apache-2.0 licensing, privacy, security, contribution, and code-signing policy documentation

          Source code for this release is available through the GitHub-generated source archives below.
          EOF

          mapfile -t EXES < <(find release-assets -type f -name '*.exe' -print | sort)
          test "${#EXES[@]}" -gt 0
          gh release create "$TAG" "${EXES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "LexiFlow v0.8.5" \
            --notes-file RELEASE_NOTES.md \
            --latest
