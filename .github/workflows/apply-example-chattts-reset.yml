name: Validate example ChatTTS reset fixes

on:
  push:
    branches:
      - fix/example-chattts-reset

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/example-chattts-reset
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Validate Python voice worker syntax
        run: python -m py_compile resources/chattts-voice/worker.py resources/chattts-voice/synthesize.py
