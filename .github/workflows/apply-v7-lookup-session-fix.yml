name: Apply V7 Lookup Session Fix

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/apply-v7-lookup-session-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V7
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply lookup session consistency repair
        run: python scripts/apply-v7-lookup-session-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f scripts/apply-v7-lookup-session-fix.py .github/workflows/apply-v7-lookup-session-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/source-context-v3.js lib/phrase-dictionary.js scripts/check-phrase-dictionary-v5.js scripts/check-user-surface-v4.js
          git add -u scripts/apply-v7-lookup-session-fix.py .github/workflows/apply-v7-lookup-session-fix.yml
          git commit -m "fix: isolate lookup sessions and source context"
          git push origin HEAD:feat/v7-airy-luminous-ui
