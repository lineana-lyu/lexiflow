name: Finish UI polish round 2

on:
  push:
    branches:
      - feat/ui-polish-round2
    paths:
      - .github/workflows/ui-round2-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ui-polish-round2
          fetch-depth: 0

      - name: Refine product wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            '? `<span class="pill green">✓ 实际调用通过</span>`': '? `<span class="pill green">✓ 连接正常</span>`',
            '? `<span class="pill red">× 实际调用失败</span>`': '? `<span class="pill red">× 连接异常</span>`',
            ': `<span class="pill amber">尚未验证</span>`;': ': `<span class="pill amber">未检查</span>`;',
            'header(\n        "设置",\n        "设置",': 'header(\n        "",\n        "设置",',
            '${codex?.cliAvailable?"按需使用":"Codex 不可用"}': '${codex?.cliAvailable?"可用":"当前不可用"}',
            '图片能力仍取决于当前 Codex 环境和所选模型；失败时可以上传本地图或跳过。': '图片能力取决于当前 AI 环境和所选模型；生成失败时可以上传本地图或直接跳过。',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check public/app.js
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/ui-round2-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'LexiFlow UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: refine user-facing service wording'
          git push origin HEAD:feat/ui-polish-round2
