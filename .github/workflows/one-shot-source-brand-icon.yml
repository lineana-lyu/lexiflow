name: One-shot Source Brand Icon

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-source-brand-icon.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - name: Move brand icon into base markup
        run: python scripts/move-brand-icon-to-source.py
      - name: Verify migration
        run: |
          node --check public/app.js
          node --check public/product-ux.js
          node --check scripts/check-runtime-authority-v3.js
          npm run check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "lexiflow-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/index.html public/product-ux.js scripts/check-runtime-authority-v3.js
          git commit -m "refactor: render brand icon directly from source [source-brand-icon]"
          git push origin HEAD:feat/v7-airy-luminous-ui
