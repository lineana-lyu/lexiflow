name: Apply V7 Phrase Audio Integrity

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - scripts/apply-v7-phrase-audio-integrity.py
      - .github/workflows/apply-v7-phrase-audio-integrity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V7
        uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply phrase audio integrity repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v7-phrase-audio-integrity.py')
          s = p.read_text(encoding='utf-8')
          old = 'new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if old not in s:
              raise SystemExit('patcher replacement target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/apply-v7-phrase-audio-integrity.py
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/check-user-surface-v4.js')
          s = p.read_text(encoding='utf-8')
          bad = 'assert(runtime.includes("const singleAudio = componentOnly ? "" : (candidateAudioUrls[0] || "")")&&runtime.includes("Boolean(singleAudio)"),"runtime must expose at most one verified continuous phrase recording");'
          good = 'assert(runtime.includes(\'const singleAudio = componentOnly ? "" : (candidateAudioUrls[0] || "")\')&&runtime.includes("Boolean(singleAudio)"),"runtime must expose at most one verified continuous phrase recording");'
          if bad not in s:
              raise SystemExit('generated regression check target not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')

          p = Path('scripts/check-expression-query-v4.js')
          s = p.read_text(encoding='utf-8')
          old = 'assert(hydration.includes("composePhrasePhonetic")&&hydration.includes("if(isPhrase&&!pronunciation?.dictionaryAudio)"), "phrase lookup must show complete phrase phonetics without stitching component audio");'
          new = 'assert(hydration.includes("composePhrasePhonetic")&&hydration.includes("if(isPhrase&&!clean(pronunciation?.phonetic))"), "phrase lookup must prefer whole-expression IPA and only compose component IPA when whole-expression IPA is unavailable");'
          if old not in s:
              raise SystemExit('expression-query regression check target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f scripts/apply-v7-phrase-audio-integrity.py .github/workflows/apply-v7-phrase-audio-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/example-hydration.js public/kokoro-voice.js server-runtime.js scripts/check-user-surface-v4.js scripts/check-expression-query-v4.js
          git add -u scripts/apply-v7-phrase-audio-integrity.py .github/workflows/apply-v7-phrase-audio-integrity.yml
          git commit -m "fix: require verified whole-expression phrase audio"
          git push origin HEAD:feat/v7-airy-luminous-ui
