name: Morphology CET Coverage Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data/morphology-seed.json
      - lib/morphology.js
      - scripts/prepare-morphology.js
      - scripts/audit-morphology-cet-coverage.js
      - package.json
      - .github/workflows/morphology-coverage.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare ECDICT exam index
        run: node scripts/prepare-ecdict.js

      - name: Prepare verified morphology database
        run: node scripts/prepare-morphology.js --force

      - name: Audit CET-4 and CET-6 coverage
        run: |
          node scripts/audit-morphology-cet-coverage.js --top 500 --backlog 50 | tee morphology-cet-coverage.md
          cat morphology-cet-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: morphology-cet-coverage
          path: morphology-cet-coverage.md
          if-no-files-found: error
