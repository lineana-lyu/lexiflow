name: One Shot Settings Status V4

on:
  push:
    branches:
      - feat/v7-airy-luminous-ui
    paths:
      - .github/workflows/one-shot-settings-status-v4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-airy-luminous-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply Settings status migration
        run: python3 scripts/migrate-settings-status-v4.py
      - name: Verify app syntax
        run: node --check public/app.js
      - name: Run full repository checks
        run: npm run check
      - name: Commit verified Settings surface
        run: |
          if git diff --quiet -- public/app.js; then
            echo "No Settings migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "fix: expose dictionary and AI connection status"
          git push origin HEAD:feat/v7-airy-luminous-ui
