name: Apply desktop persistence migration

on:
  push:
    branches:
      - feat/desktop-app-persistence
    paths:
      - scripts/apply-desktop-persistence.py
      - .github/workflows/apply-desktop-persistence.yml

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/desktop-app-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply persistence migration
        run: python scripts/apply-desktop-persistence.py

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Build Windows desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Ensure no tracked test artifacts were added
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)(tests?|fixtures?|mocks?)(/|$)|\.(test|spec)\.' }
          if ($bad) { $bad; exit 1 }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Remove temporary migration runner
        shell: pwsh
        run: |
          Remove-Item scripts/apply-desktop-persistence.py -Force
          Remove-Item .github/workflows/apply-desktop-persistence.yml -Force
          if (Test-Path scripts) { if (-not (Get-ChildItem scripts -Force)) { Remove-Item scripts -Force } }

      - name: Commit desktop migration
        shell: pwsh
        run: |
          git config user.name "LexiFlow Desktop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: migrate LexiFlow to persistent desktop app"
          git push origin HEAD:feat/desktop-app-persistence
